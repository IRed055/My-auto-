
name: Build Red Auto Clicker v6.0

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Red Auto Clicker v6.0 Files
        run: |
          rm -rf app build.gradle settings.gradle
          python3 - << 'PYEOF'
          import os, textwrap
          def write_file(path, content):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(textwrap.dedent(content).strip() + "\n")
          def append_file(path, content):
              with open(path, 'a', encoding='utf-8') as f:
                  f.write("\n" + textwrap.dedent(content).strip() + "\n")
          write_file("settings.gradle", r"""
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "RedAutoClicker"
              include ':app'
          """)
          write_file("gradle.properties", r"""
             android.useAndroidX=true
             android.enableJetifier=true
          """)
          write_file("build.gradle", r"""
              plugins {
                  id 'com.android.application' version '8.2.2' apply false
              }
          """)
          write_file("app/build.gradle", r"""
              plugins {
                  id 'com.android.application'
              }
              android {
                  namespace 'com.smartclicker.app'
                  compileSdk 34
                  defaultConfig {
                      applicationId "com.smartclicker.app"
                      minSdk 24
                      targetSdk 28
                      versionCode 7
                      versionName "7.0"
                  }
                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_1_8
                      targetCompatibility JavaVersion.VERSION_1_8
                  }
              }
              dependencies {
                 implementation 'com.google.mlkit:text-recognition:16.0.1'
             }
          """)
          write_file("app/src/main/res/values/strings.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <resources>
                  <string name="app_name">Red Auto Clicker</string>
                  <string name="acc_desc">Red Auto Clicker v6.0 - نظام الأوامر الذكي والفحص البصري المتكامل</string>
              </resources>
          """)
          write_file("app/src/main/res/xml/accessibility_config.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
                  android:accessibilityEventTypes="typeWindowStateChanged|typeNotificationStateChanged"
                  android:accessibilityFeedbackType="feedbackGeneric"
                  android:accessibilityFlags="flagDefault"
                  android:canPerformGestures="true"
                  android:canRetrieveWindowContent="true"
                  android:canTakeScreenshot="true"
                  android:description="@string/acc_desc" />
          """)
          write_file("app/src/main/AndroidManifest.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                  <application
                      android:label="@string/app_name"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                      <activity
                          android:name=".MainActivity"
                          android:exported="true"
                          android:windowSoftInputMode="stateHidden|adjustResize">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                      <activity
                          android:name=".ScreenCaptureActivity"
                          android:exported="false"
                          android:theme="@android:style/Theme.Translucent.NoTitleBar" />
                      <service
                          android:name=".ClickerService"
                          android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                          android:exported="true">
                          <intent-filter>
                              <action android:name="android.accessibilityservice.AccessibilityService" />
                          </intent-filter>
                          <meta-data
                              android:name="android.accessibilityservice"
                              android:resource="@xml/accessibility_config" />
                      </service>
                  </application>
              </manifest>
          """)
          write_file("app/src/main/java/com/smartclicker/app/ScreenCaptureActivity.java", r"""
              package com.smartclicker.app;
              import android.app.Activity;
              import android.content.Context;
              import android.content.Intent;
              import android.media.projection.MediaProjectionManager;
              import android.os.Bundle;
              import android.widget.Toast;
              public class ScreenCaptureActivity extends Activity {
                  private static final int REQ_CODE = 9001;
                  public static Runnable pendingActionAfterGrant;
                  @Override
                  protected void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);
                      MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                      if (mpm != null) {
                          startActivityForResult(mpm.createScreenCaptureIntent(), REQ_CODE);
                      } else {
                          finish();
                      }
                  }
                  @Override
                  protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                      if (requestCode == REQ_CODE) {
                          if (resultCode == RESULT_OK && data != null && ClickerService.instance != null) {
                              ClickerService.instance.initScreenReader(resultCode, data);
                              Toast.makeText(this, "✅ تم تفعيل قراءة الشاشة الحية بنجاح!", Toast.LENGTH_SHORT).show();
                              if (pendingActionAfterGrant != null) {
                                  final Runnable r = pendingActionAfterGrant;
                                  pendingActionAfterGrant = null;
                                  ClickerService.instance.runDelayed(r, 250);
                              }
                          } else {
                              pendingActionAfterGrant = null;
                              Toast.makeText(this, "❌ لم يتم منح صلاحية قراءة الشاشة", Toast.LENGTH_SHORT).show();
                          }
                      }
                      finish();
                  }
              }
          """)
          write_file("app/src/main/java/com/smartclicker/app/StepItem.java", r"""
             package com.smartclicker.app;
             import android.graphics.Color;
