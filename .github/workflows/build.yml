              package com.smartclicker.app;
              import android.content.Context;
              import android.content.SharedPreferences;
              import org.json.JSONArray;
              import org.json.JSONObject;
              import java.util.ArrayList;
              import java.util.Iterator;
              import java.util.List;
              public class StorageManager {
                  private static final String PREF_NAME = "RedClickerStorageV3";
                  private static final String KEY_DATA = "folders_json_v3";
                  private static final String KEY_AUTO_BACKUP = "auto_emergency_backup_v6";
                  public static void saveAutoBackup(Context ctx, List<StepItem> steps) {
                      if (steps == null || steps.isEmpty()) return;
                      try {
                          JSONArray arr = new JSONArray();
                          for (StepItem s : steps) arr.put(s.toJson());
                          ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                              .edit().putString(KEY_AUTO_BACKUP, arr.toString()).commit();
                      } catch (Exception ignored) {}
                  }
                  public static int getAutoBackupCount(Context ctx) {
                      String raw = ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE).getString(KEY_AUTO_BACKUP, null);
                      if (raw == null || raw.isEmpty()) return 0;
                      try {
                          return new JSONArray(raw).length();
                      } catch (Exception e) {
                          return 0;
                      }
                  }
                  public static List<StepItem> loadAutoBackup(Context ctx) {
                      List<StepItem> list = new ArrayList<>();
                      String raw = ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE).getString(KEY_AUTO_BACKUP, null);
                      if (raw != null) {
                          try {
                              JSONArray arr = new JSONArray(raw);
                              for (int i = 0; i < arr.length(); i++) {
                                  JSONObject o = arr.optJSONObject(i);
                                  if (o != null) list.add(StepItem.fromJson(o));
                              }
                          } catch (Exception ignored) {}
                      }
                      return list;
                  }
                  public static void clearAutoBackup(Context ctx) {
                      ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE).edit().remove(KEY_AUTO_BACKUP).commit();
                  }
                  public static JSONObject getRoot(Context ctx) {
                      SharedPreferences sp = ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE);
                      String raw = sp.getString(KEY_DATA, null);
                      if (raw != null) {
                          try {
                              JSONObject r = new JSONObject(raw);
                              JSONObject f = r.optJSONObject("folders");
                              if (f != null && f.length() > 0) return r;
                          } catch (Exception ignored) {}
                      }
                      JSONObject root = new JSONObject();
                      try {
                          JSONObject folders = new JSONObject();
                          folders.put("مجلد 1", new JSONObject());
                          root.put("folders", folders);
                      } catch (Exception ignored) {}
                      saveRoot(ctx, root);
                      return root;
                  }
                  public static void saveRoot(Context ctx, JSONObject root) {
                      ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE).edit().putString(KEY_DATA, root.toString()).commit();
                  }
                  public static List<String> getFolderNames(Context ctx) {
                      List<String> list = new ArrayList<>();
                      JSONObject folders = getRoot(ctx).optJSONObject("folders");
                      if (folders != null) {
                          Iterator<String> it = folders.keys();
                          while (it.hasNext()) list.add(it.next());
                      }
                      if (list.isEmpty()) { addFolder(ctx, "مجلد 1"); list.add("مجلد 1"); }
                      return list;
                  }
                  public static void addFolder(Context ctx, String folderName) {
                      try {
                          JSONObject root = getRoot(ctx);
                          JSONObject folders = root.optJSONObject("folders");
                          if (folders == null) { folders = new JSONObject(); root.put("folders", folders); }
                          if (!folders.has(folderName)) { folders.put(folderName, new JSONObject()); saveRoot(ctx, root); }
                      } catch (Exception ignored) {}
                  }
                  public static boolean renameFolder(Context ctx, String oldName, String newName) {
                      if (oldName.equals(newName) || newName.isEmpty()) return false;
                      try {
                          JSONObject root = getRoot(ctx);
                          JSONObject folders = root.optJSONObject("folders");
                          if (folders != null && folders.has(oldName) && !folders.has(newName)) {
                              JSONObject content = folders.optJSONObject(oldName);
                              folders.put(newName, content != null ? content : new JSONObject());
                              folders.remove(oldName);
                              saveRoot(ctx, root);
                              return true;
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }
                  public static boolean deleteFolder(Context ctx, String folderName) {
                      if (getFolderNames(ctx).size() <= 1) return false;
                      try {
                          JSONObject root = getRoot(ctx);
                          JSONObject folders = root.optJSONObject("folders");
                          if (folders != null && folders.length() > 1) {
                              folders.remove(folderName);
                              saveRoot(ctx, root);
                              return true;
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }
                  public static List<String> getProfileNames(Context ctx, String folderName) {
                      List<String> list = new ArrayList<>();
                      JSONObject folders = getRoot(ctx).optJSONObject("folders");
                      if (folders != null) {
                          JSONObject folder = folders.optJSONObject(folderName);
                          if (folder != null) {
                              Iterator<String> it = folder.keys();
                              while (it.hasNext()) list.add(it.next());
                          }
                      }
                      return list;
                  }
                  public static void saveProfile(Context ctx, String folderName, String profileName, List<StepItem> steps) {
                      try {
                          JSONObject root = getRoot(ctx);
                          JSONObject folders = root.optJSONObject("folders");
                          if (folders == null) { folders = new JSONObject(); root.put("folders", folders); }
                          JSONObject folder = folders.optJSONObject(folderName);
                          if (folder == null) { folder = new JSONObject(); folders.put(folderName, folder); }
                          JSONArray arr = new JSONArray();
                          for (StepItem s : steps) arr.put(s.toJson());
                          folder.put(profileName, arr);
                          saveRoot(ctx, root);
                      } catch (Exception ignored) {}
                  }
                  public static List<StepItem> loadProfile(Context ctx, String folderName, String profileName) {
                      List<StepItem> list = new ArrayList<>();
                      JSONObject folders = getRoot(ctx).optJSONObject("folders");
                      if (folders != null) {
                          JSONObject folder = folders.optJSONObject(folderName);
                          if (folder != null) {
                              JSONArray arr = folder.optJSONArray(profileName);
                              if (arr != null) {
                                  for (int i = 0; i < arr.length(); i++) {
                                      JSONObject o = arr.optJSONObject(i);
                                      if (o != null) list.add(StepItem.fromJson(o));
                                  }
                              }
                          }
                      }
                      return list;
                  }
                  public static void deleteProfile(Context ctx, String folderName, String profileName) {
                      try {
                          JSONObject root = getRoot(ctx);
                          JSONObject folders = root.optJSONObject("folders");
                          if (folders != null) {
                              JSONObject folder = folders.optJSONObject(folderName);
                              if (folder != null) { folder.remove(profileName); saveRoot(ctx, root); }
                          }
                      } catch (Exception ignored) {}
                  }
              }
