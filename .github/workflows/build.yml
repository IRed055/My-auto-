                  private EditText createPopupInput(LinearLayout parent, String label, String val, boolean numeric, boolean withQuickChips) {
                      TextView tv = new TextView(this);
                      tv.setText(label);
                      tv.setTextColor(Color.parseColor("#E4E4E7"));
                      tv.setTextSize(12);
                      tv.setPadding(0, 8, 0, 4);
                      parent.addView(tv);
                      LinearLayout inputRow = new LinearLayout(this);
                      inputRow.setOrientation(LinearLayout.HORIZONTAL);
                      inputRow.setGravity(Gravity.CENTER_VERTICAL);
                      final EditText et = new EditText(this);
                      if (numeric) et.setInputType(InputType.TYPE_CLASS_NUMBER);
                      else et.setInputType(InputType.TYPE_CLASS_TEXT);
                      et.setSingleLine(true);
                      et.setImeOptions(EditorInfo.IME_ACTION_DONE | EditorInfo.IME_FLAG_NO_EXTRACT_UI);
                      et.setOnEditorActionListener((v, actionId, event) -> {
                          if (actionId == EditorInfo.IME_ACTION_DONE || (event != null && event.getKeyCode() == KeyEvent.KEYCODE_ENTER)) {
                              InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                              if (imm != null) imm.hideSoftInputFromWindow(et.getWindowToken(), 0);
                              et.clearFocus();
                              return true;
                          }
                          return false;
                      });
                      et.setText(val);
                      et.setTextColor(Color.WHITE);
                      GradientDrawable bg = new GradientDrawable();
                      bg.setColor(Color.parseColor("#27272A"));
                      bg.setCornerRadius(12f);
                      bg.setStroke(2, Color.parseColor("#3F3F46"));
                      et.setBackgroundDrawable(bg);
                      et.setPadding(18, 10, 18, 10);
                      et.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                      inputRow.addView(et);
                      if (withQuickChips) {
                          Button bClear = new Button(this);
                          bClear.setText("✖");
                          bClear.setTextColor(Color.WHITE);
                          bClear.setTextSize(11);
                          GradientDrawable cBg = new GradientDrawable();
                          cBg.setColor(Color.parseColor("#991B1B"));
                          cBg.setCornerRadius(10f);
                          bClear.setBackgroundDrawable(cBg);
                          LinearLayout.LayoutParams clp = new LinearLayout.LayoutParams(72, 66);
                          clp.setMargins(8, 0, 0, 0);
                          bClear.setLayoutParams(clp);
                          bClear.setOnClickListener(v -> et.setText("0"));
                          inputRow.addView(bClear);
                      }
                      parent.addView(inputRow);
                      if (withQuickChips) {
                          LinearLayout chipsRow = new LinearLayout(this);
                          chipsRow.setOrientation(LinearLayout.HORIZONTAL);
                          chipsRow.setPadding(0, 5, 0, 3);
                          int[] increments = {50, 100, 500, 1000};
                          for (final int inc : increments) {
                              Button chip = new Button(this);
                              chip.setText("+" + inc);
                              chip.setTextColor(Color.WHITE);
                              chip.setTextSize(11);
                              chip.setPadding(4, 2, 4, 2);
                              GradientDrawable chBg = new GradientDrawable();
                              chBg.setColor(Color.parseColor("#3F3F46"));
                              chBg.setCornerRadius(10f);
                              chip.setBackgroundDrawable(chBg);
                              LinearLayout.LayoutParams chLp = new LinearLayout.LayoutParams(0, 62, 1f);
                              chLp.setMargins(3, 0, 3, 0);
                              chip.setLayoutParams(chLp);
                              chip.setOnClickListener(v -> {
                                  int cur = 0;
                                  try { cur = Integer.parseInt(et.getText().toString().trim()); } catch (Exception ignored) {}
                                  et.setText(String.valueOf(cur + inc));
                              });
                              chipsRow.addView(chip);
                          }
                          parent.addView(chipsRow);
                      }
                      return et;
                  }
                  private Button createPopupButton(String text, String colorHex) {
                      Button b = new Button(this);
                      b.setText(text);
                      b.setTextColor(Color.WHITE);
                      b.setTextSize(12);
                      GradientDrawable bg = new GradientDrawable();
                      bg.setColor(Color.parseColor(colorHex));
                      bg.setCornerRadius(16f);
                      b.setBackgroundDrawable(bg);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
