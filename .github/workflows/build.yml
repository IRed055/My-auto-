name: Build Red Auto Clicker v3.0

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Red Auto Clicker v3.0 - Part 1
        run: |
          rm -rf app build.gradle settings.gradle
          python3 - << 'PYEOF'
          import os, textwrap

          def write_file(path, content):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(textwrap.dedent(content).strip() + "\n")

          write_file("settings.gradle", r"""
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "RedAutoClicker"
              include ':app'
          """)

          write_file("build.gradle", r"""
              plugins {
                  id 'com.android.application' version '8.2.2' apply false
              }
          """)

          write_file("app/build.gradle", r"""
              plugins {
                  id 'com.android.application'
              }
              android {
                  namespace 'com.smartclicker.app'
                  compileSdk 34
                  defaultConfig {
                      applicationId "com.smartclicker.app"
                      minSdk 24
                      targetSdk 34
                      versionCode 3
                      versionName "3.0"
                  }
                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_1_8
                      targetCompatibility JavaVersion.VERSION_1_8
                  }
              }
              dependencies {
              }
          """)

          write_file("app/src/main/res/values/strings.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <resources>
                  <string name="app_name">Red Auto Clicker</string>
                  <string name="acc_desc">Red Auto Clicker v3.0 - نظام التحكم الذكي متعدد الطبقات والشروط البصرية</string>
              </resources>
          """)

          write_file("app/src/main/res/xml/accessibility_config.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
                  android:accessibilityEventTypes="typeWindowStateChanged|typeNotificationStateChanged"
                  android:accessibilityFeedbackType="feedbackGeneric"
                  android:accessibilityFlags="flagDefault"
                  android:canPerformGestures="true"
                  android:canRetrieveWindowContent="true"
                  android:description="@string/acc_desc" />
          """)

          write_file("app/src/main/AndroidManifest.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
                  <application
                      android:label="@string/app_name"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                      <activity
                          android:name=".MainActivity"
                          android:exported="true">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                      <activity
                          android:name=".ScreenCaptureActivity"
                          android:exported="false"
                          android:theme="@android:style/Theme.Translucent.NoTitleBar" />
                      <service
                          android:name=".ClickerService"
                          android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                          android:exported="true">
                          <intent-filter>
                              <action android:name="android.accessibilityservice.AccessibilityService" />
                          </intent-filter>
                          <meta-data
                              android:name="android.accessibilityservice"
                              android:resource="@xml/accessibility_config" />
                      </service>
                  </application>
              </manifest>
          """)

          write_file("app/src/main/java/com/smartclicker/app/ScreenCaptureActivity.java", r"""
              package com.smartclicker.app;

              import android.app.Activity;
              import android.content.Context;
              import android.content.Intent;
              import android.media.projection.MediaProjectionManager;
              import android.os.Bundle;
              import android.widget.Toast;

              public class ScreenCaptureActivity extends Activity {
                  private static final int REQ_CODE = 9001;

                  @Override
                  protected void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);
                      MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                      if (mpm != null) {
                          startActivityForResult(mpm.createScreenCaptureIntent(), REQ_CODE);
                      } else {
                          finish();
                      }
                  }

                  @Override
                  protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                      if (requestCode == REQ_CODE) {
                          if (resultCode == RESULT_OK && data != null && ClickerService.instance != null) {
                              ClickerService.instance.initScreenReader(resultCode, data);
                              Toast.makeText(this, "تم تفعيل الفحص البصري عند الطلب بنجاح!", Toast.LENGTH_SHORT).show();
                          } else {
                              Toast.makeText(this, "لم يتم منح صلاحية الفحص البصري", Toast.LENGTH_SHORT).show();
                          }
                      }
                      finish();
                  }
              }
          """)

          write_file("app/src/main/java/com/smartclicker/app/StepItem.java", r"""
              package com.smartclicker.app;

              import android.graphics.Color;
              import android.view.WindowManager;
              import org.json.JSONObject;

              public class StepItem {
                  public static final int TYPE_TAP = 0;
                  public static final int TYPE_SWIPE = 1;
                  public static final int TYPE_ZOOM_OUT = 2;
                  public static final int TYPE_ZOOM_IN = 3;
                  public static final int TYPE_JUMP = 4;

                  public int stepNum = 1;
                  public int type = TYPE_TAP;
                  public String name = "";
                  public int x = 400;
                  public int y = 400;
                  public int x2 = 650;
                  public int y2 = 550;
                  public int delayMs = 300;
                  public int durationMs = 60;
                  public int repeatCount = 1;

                  public boolean useRandom = true;
                  public boolean useCustomRandom = false;
                  public int customRandPx = 11;
                  public int customRandMs = 35;
                  public int customRandDur = 15;

                  public int jumpTargetStep = 1;
                  public int jumpRepeatCount = 3;
                  public transient int currentJumpCount = 0;

                  // نظام الشروط البصرية والألوان عند الطلب
                  public boolean useCondition = false;
                  public int condMode = 0; // 0=نقطة لون، 1=مربع منطقة، 2=نسبة امتلاء شريط
                  public int condX = 500;
                  public int condY = 500;
                  public int condColor = Color.rgb(255, 200, 0);
                  public boolean useSecondCond = false;
                  public boolean condLogicAnd = true;
                  public int condX2 = 600;
                  public int condY2 = 500;
                  public int condColor2 = Color.rgb(200, 0, 255);
                  public int condBarPct = 90;
                  public int condBarDir = 0; // 0=يسار ليمين، 1=يمين ليسار
                  public int condTolerance = 88;
                  public int condOnSuccess = 0; // 0=نفذ العملية وأكمل، 1=اقفز لخطوة محددة
                  public int condSuccessJumpStep = 1;
                  public int condOnFail = 0; // 0=تخطَّ للخطوة التالية، 1=انتظر حتى المهلة، 2=اقفز لخطوة بديلة
                  public int condWaitTimeoutMs = 3000;
                  public int condFailJumpStep = 1;

                  public transient TargetView primaryView;
                  public transient TargetView secondaryView;
                  public transient WindowManager.LayoutParams primaryParams;
                  public transient WindowManager.LayoutParams secondaryParams;

                  public String getTypeLabel() {
                      switch (type) {
                          case TYPE_SWIPE: return "سحب ⇄";
                          case TYPE_ZOOM_OUT: return "تصغير 🔍-";
                          case TYPE_ZOOM_IN: return "تكبير 🔍+";
                          case TYPE_JUMP: return "قفز ↺";
                          default: return "لمسة 🎯";
                      }
                  }

                  public boolean hasSecondaryPoint() {
                      return type == TYPE_SWIPE || type == TYPE_ZOOM_OUT || type == TYPE_ZOOM_IN;
                  }

                  public JSONObject toJson() {
                      JSONObject o = new JSONObject();
                      try {
                          o.put("stepNum", stepNum);
                          o.put("type", type);
                          o.put("name", name == null ? "" : name);
                          o.put("x", primaryParams != null ? primaryParams.x : x);
                          o.put("y", primaryParams != null ? primaryParams.y : y);
                          o.put("x2", secondaryParams != null ? secondaryParams.x : x2);
                          o.put("y2", secondaryParams != null ? secondaryParams.y : y2);
                          o.put("delayMs", delayMs);
                          o.put("durationMs", durationMs);
                          o.put("repeatCount", Math.max(1, repeatCount));
                          o.put("useRandom", useRandom);
                          o.put("useCustomRandom", useCustomRandom);
                          o.put("customRandPx", customRandPx);
                          o.put("customRandMs", customRandMs);
                          o.put("customRandDur", customRandDur);
                          o.put("jumpTargetStep", jumpTargetStep);
                          o.put("jumpRepeatCount", jumpRepeatCount);
                          o.put("useCondition", useCondition);
                          o.put("condMode", condMode);
                          o.put("condX", condX);
                          o.put("condY", condY);
                          o.put("condColor", condColor);
                          o.put("useSecondCond", useSecondCond);
                          o.put("condLogicAnd", condLogicAnd);
                          o.put("condX2", condX2);
                          o.put("condY2", condY2);
                          o.put("condColor2", condColor2);
                          o.put("condBarPct", condBarPct);
                          o.put("condBarDir", condBarDir);
                          o.put("condTolerance", condTolerance);
                          o.put("condOnSuccess", condOnSuccess);
                          o.put("condSuccessJumpStep", condSuccessJumpStep);
                          o.put("condOnFail", condOnFail);
                          o.put("condWaitTimeoutMs", condWaitTimeoutMs);
                          o.put("condFailJumpStep", condFailJumpStep);
                      } catch (Exception ignored) {}
                      return o;
                  }

                  public static StepItem fromJson(JSONObject o) {
                      StepItem s = new StepItem();
                      s.stepNum = o.optInt("stepNum", 1);
                      s.type = o.optInt("type", TYPE_TAP);
                      s.name = o.optString("name", "");
                      s.x = o.optInt("x", 400);
                      s.y = o.optInt("y", 400);
                      s.x2 = o.optInt("x2", 650);
                      s.y2 = o.optInt("y2", 550);
                      s.delayMs = o.optInt("delayMs", 300);
                      s.durationMs = o.optInt("durationMs", 60);
                      s.repeatCount = Math.max(1, o.optInt("repeatCount", 1));
                      s.useRandom = o.optBoolean("useRandom", true);
                      s.useCustomRandom = o.optBoolean("useCustomRandom", false);
                      s.customRandPx = o.optInt("customRandPx", 11);
                      s.customRandMs = o.optInt("customRandMs", 35);
                      s.customRandDur = o.optInt("customRandDur", 15);
                      s.jumpTargetStep = o.optInt("jumpTargetStep", 1);
                      s.jumpRepeatCount = o.optInt("jumpRepeatCount", 3);
                      s.useCondition = o.optBoolean("useCondition", false);
                      s.condMode = o.optInt("condMode", 0);
                      s.condX = o.optInt("condX", 500);
                      s.condY = o.optInt("condY", 500);
                      s.condColor = o.optInt("condColor", Color.rgb(255, 200, 0));
                      s.useSecondCond = o.optBoolean("useSecondCond", false);
                      s.condLogicAnd = o.optBoolean("condLogicAnd", true);
                      s.condX2 = o.optInt("condX2", 600);
                      s.condY2 = o.optInt("condY2", 500);
                      s.condColor2 = o.optInt("condColor2", Color.rgb(200, 0, 255));
                      s.condBarPct = o.optInt("condBarPct", 90);
                      s.condBarDir = o.optInt("condBarDir", 0);
                      s.condTolerance = o.optInt("condTolerance", 88);
                      s.condOnSuccess = o.optInt("condOnSuccess", 0);
                      s.condSuccessJumpStep = o.optInt("condSuccessJumpStep", 1);
                      s.condOnFail = o.optInt("condOnFail", 0);
                      s.condWaitTimeoutMs = o.optInt("condWaitTimeoutMs", 3000);
                      s.condFailJumpStep = o.optInt("condFailJumpStep", 1);
                      return s;
                  }
              }
          """)

          write_file("app/src/main/java/com/smartclicker/app/TargetView.java", r"""
              package com.smartclicker.app;

              import android.content.Context;
              import android.graphics.Canvas;
              import android.graphics.Color;
              import android.graphics.Paint;
              import android.view.View;

              public class TargetView extends View {
                  private final StepItem item;
                  private final boolean isSecondary;
                  private boolean highlighted = false;
                  private final Paint ringPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint fillPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint textPaint = new Paint(Paint.ANTI_ALIAS_FLAG);

                  public TargetView(Context context, StepItem item, boolean isSecondary) {
                      super(context);
                      this.item = item;
                      this.isSecondary = isSecondary;
                      ringPaint.setStyle(Paint.Style.STROKE);
                      ringPaint.setStrokeWidth(3.2f);
                      fillPaint.setStyle(Paint.Style.FILL);
                      textPaint.setColor(Color.WHITE);
                      textPaint.setTextSize(24f);
                      textPaint.setTextAlign(Paint.Align.CENTER);
                      textPaint.setFakeBoldText(true);
                      textPaint.setShadowLayer(4f, 0f, 0f, Color.BLACK);
                  }

                  public void setHighlighted(boolean h) {
                      if (this.highlighted != h) {
                          this.highlighted = h;
                          invalidate();
                      }
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      float w = getWidth();
                      float h = getHeight();
                      float cx = w / 2f;
                      float cy = h / 2f;
                      float r = Math.min(w, h) / 2f - 4f;

                      int baseColor;
                      if (highlighted) {
                          baseColor = Color.parseColor("#FFD700");
                      } else {
                          switch (item.type) {
                              case StepItem.TYPE_SWIPE: baseColor = Color.parseColor("#10B981"); break;
                              case StepItem.TYPE_ZOOM_OUT: baseColor = Color.parseColor("#06B6D4"); break;
                              case StepItem.TYPE_ZOOM_IN: baseColor = Color.parseColor("#8B5CF6"); break;
                              case StepItem.TYPE_JUMP: baseColor = Color.parseColor("#F59E0B"); break;
                              default: baseColor = Color.parseColor("#EF4444"); break;
                          }
                      }

                      fillPaint.setColor(highlighted ? Color.argb(140, 255, 215, 0) : Color.argb(40, Color.red(baseColor), Color.green(baseColor), Color.blue(baseColor)));
                      canvas.drawCircle(cx, cy, r, fillPaint);

                      ringPaint.setColor(baseColor);
                      ringPaint.setStrokeWidth(highlighted ? 6f : 3.2f);
                      canvas.drawCircle(cx, cy, r, ringPaint);

                      float tickLen = r * 0.35f;
                      canvas.drawLine(cx - r, cy, cx - r + tickLen, cy, ringPaint);
                      canvas.drawLine(cx + r - tickLen, cy, cx + r, cy, ringPaint);
                      canvas.drawLine(cx, cy - r, cx, cy - r + tickLen, ringPaint);
                      canvas.drawLine(cx, cy + r - tickLen, cx, cy + r, ringPaint);

                      fillPaint.setColor(highlighted ? Color.YELLOW : Color.WHITE);
                      canvas.drawCircle(cx, cy, 2.8f, fillPaint);

                      String label = String.valueOf(item.stepNum);
                      if (item.type == StepItem.TYPE_SWIPE) {
                          label += isSecondary ? "E" : "S";
                      } else if (item.type == StepItem.TYPE_ZOOM_OUT) {
                          label += isSecondary ? "B-" : "A-";
                      } else if (item.type == StepItem.TYPE_ZOOM_IN) {
                          label += isSecondary ? "B+" : "A+";
                      } else if (item.type == StepItem.TYPE_JUMP) {
                          label += "↺";
                      }
                      if (item.useCondition && !isSecondary) {
                          label += "👁";
                      }

                      textPaint.setColor(highlighted ? Color.BLACK : Color.WHITE);
                      Paint.FontMetrics fm = textPaint.getFontMetrics();
                      float textY = cy - (fm.ascent + fm.descent) / 2f;
                      canvas.drawText(label, cx, textY, textPaint);
                  }
              }
          """)

          write_file("app/src/main/java/com/smartclicker/app/VectorOverlayView.java", r"""
              package com.smartclicker.app;

              import android.content.Context;
              import android.graphics.Canvas;
              import android.graphics.Color;
              import android.graphics.Paint;
              import android.graphics.Path;
              import android.view.View;
              import java.util.List;

              public class VectorOverlayView extends View {
                  private final List<StepItem> steps;
                  private final Paint linePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint arrowPaint = new Paint(Paint.ANTI_ALIAS_FLAG);

                  public VectorOverlayView(Context context, List<StepItem> steps) {
                      super(context);
                      this.steps = steps;
                      linePaint.setStyle(Paint.Style.STROKE);
                      linePaint.setStrokeWidth(3.2f);
                      arrowPaint.setStyle(Paint.Style.FILL);
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      if (steps == null) return;
                      int[] myLoc = new int[2];
                      getLocationOnScreen(myLoc);

                      for (StepItem s : steps) {
                          if (!s.hasSecondaryPoint() || s.primaryView == null || s.secondaryView == null) continue;
                          if (s.primaryView.getVisibility() != View.VISIBLE) continue;

                          int[] p1 = new int[2];
                          int[] p2 = new int[2];
                          s.primaryView.getLocationOnScreen(p1);
                          s.secondaryView.getLocationOnScreen(p2);

                          float x1 = p1[0] - myLoc[0] + s.primaryView.getWidth() / 2f;
                          float y1 = p1[1] - myLoc[1] + s.primaryView.getHeight() / 2f;
                          float x2 = p2[0] - myLoc[0] + s.secondaryView.getWidth() / 2f;
                          float y2 = p2[1] - myLoc[1] + s.secondaryView.getHeight() / 2f;

                          if (s.type == StepItem.TYPE_SWIPE) {
                              int c = Color.argb(175, 16, 185, 129);
                              linePaint.setColor(c);
                              arrowPaint.setColor(c);
                              canvas.drawLine(x1, y1, x2, y2, linePaint);
                              drawArrowHead(canvas, x1, y1, (x1 + x2) / 2f, (y1 + y2) / 2f, 18f);
                              drawArrowHead(canvas, x1, y1, x2, y2, 20f);
                          } else if (s.type == StepItem.TYPE_ZOOM_OUT) {
                              int c = Color.argb(175, 6, 182, 212);
                              linePaint.setColor(c);
                              arrowPaint.setColor(c);
                              canvas.drawLine(x1, y1, x2, y2, linePaint);
                              float mx = (x1 + x2) / 2f;
                              float my = (y1 + y2) / 2f;
                              drawArrowHead(canvas, x1, y1, mx, my, 19f);
                              drawArrowHead(canvas, x2, y2, mx, my, 19f);
                          } else if (s.type == StepItem.TYPE_ZOOM_IN) {
                              int c = Color.argb(175, 139, 92, 246);
                              linePaint.setColor(c);
                              arrowPaint.setColor(c);
                              canvas.drawLine(x1, y1, x2, y2, linePaint);
                              float mx = (x1 + x2) / 2f;
                              float my = (y1 + y2) / 2f;
                              drawArrowHead(canvas, mx, my, (mx + x1) / 2f, (my + y1) / 2f, 19f);
                              drawArrowHead(canvas, mx, my, (mx + x2) / 2f, (my + y2) / 2f, 19f);
                          }
                      }
                  }

                  private void drawArrowHead(Canvas canvas, float fromX, float fromY, float toX, float toY, float size) {
                      double angle = Math.atan2(toY - fromY, toX - fromX);
                      Path path = new Path();
                      path.moveTo(toX, toY);
                      path.lineTo((float) (toX - size * Math.cos(angle - Math.PI / 6)),
                                  (float) (toY - size * Math.sin(angle - Math.PI / 6)));
                      path.lineTo((float) (toX - size * Math.cos(angle + Math.PI / 6)),
                                  (float) (toY - size * Math.sin(angle + Math.PI / 6)));
                      path.close();
                      canvas.drawPath(path, arrowPaint);
                  }
              }
          """)

          write_file("app/src/main/java/com/smartclicker/app/StorageManager.java", r"""
              package com.smartclicker.app;

              import android.content.Context;
              import android.content.SharedPreferences;
              import org.json.JSONArray;
              import org.json.JSONObject;
              import java.util.ArrayList;
              import java.util.Iterator;
              import java.util.List;

              public class StorageManager {
                  private static final String PREF_NAME = "RedClickerStorageV3";
                  private static final String KEY_DATA = "folders_json_v3";

                  public static JSONObject getRoot(Context ctx) {
                      SharedPreferences sp = ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE);
                      String raw = sp.getString(KEY_DATA, null);
                      if (raw != null) {
                          try {
                              JSONObject r = new JSONObject(raw);
                              JSONObject f = r.optJSONObject("folders");
                              if (f != null && f.length() > 0) return r;
                          } catch (Exception ignored) {}
                      }
                      JSONObject root = new JSONObject();
                      try {
                          JSONObject folders = new JSONObject();
                          folders.put("مجلد 1", new JSONObject());
                          root.put("folders", folders);
                      } catch (Exception ignored) {}
                      saveRoot(ctx, root);
                      return root;
                  }

                  public static void saveRoot(Context ctx, JSONObject root) {
                      ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                          .edit().putString(KEY_DATA, root.toString()).commit();
                  }

                  public static List<String> getFolderNames(Context ctx) {
                      List<String> list = new ArrayList<>();
                      JSONObject folders = getRoot(ctx).optJSONObject("folders");
                      if (folders != null) {
                          Iterator<String> it = folders.keys();
                          while (it.hasNext()) {
                              list.add(it.next());
                          }
                      }
                      if (list.isEmpty()) {
                          addFolder(ctx, "مجلد 1");
                          list.add("مجلد 1");
                      }
                      return list;
                  }

                  public static void addFolder(Context ctx, String folderName) {
                      try {
                          JSONObject root = getRoot(ctx);
                          JSONObject folders = root.optJSONObject("folders");
                          if (folders == null) { folders = new JSONObject(); root.put("folders", folders); }
                          if (!folders.has(folderName)) {
                              folders.put(folderName, new JSONObject());
                              saveRoot(ctx, root);
                          }
                      } catch (Exception ignored) {}
                  }

                  public static boolean renameFolder(Context ctx, String oldName, String newName) {
                      if (oldName.equals(newName) || newName.isEmpty()) return false;
                      try {
                          JSONObject root = getRoot(ctx);
                          JSONObject folders = root.optJSONObject("folders");
                          if (folders != null && folders.has(oldName) && !folders.has(newName)) {
                              JSONObject content = folders.optJSONObject(oldName);
                              folders.put(newName, content != null ? content : new JSONObject());
                              folders.remove(oldName);
                              saveRoot(ctx, root);
                              return true;
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }

                  public static boolean deleteFolder(Context ctx, String folderName) {
                      List<String> current = getFolderNames(ctx);
                      if (current.size() <= 1) return false;
                      try {
                          JSONObject root = getRoot(ctx);
                          JSONObject folders = root.optJSONObject("folders");
                          if (folders != null && folders.length() > 1) {
                              folders.remove(folderName);
                              saveRoot(ctx, root);
                              return true;
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }

                  public static List<String> getProfileNames(Context ctx, String folderName) {
                      List<String> list = new ArrayList<>();
                      JSONObject folders = getRoot(ctx).optJSONObject("folders");
                      if (folders != null) {
                          JSONObject folder = folders.optJSONObject(folderName);
                          if (folder != null) {
                              Iterator<String> it = folder.keys();
                              while (it.hasNext()) {
                                  list.add(it.next());
                              }
                          }
                      }
                      return list;
                  }

                  public static void saveProfile(Context ctx, String folderName, String profileName, List<StepItem> steps) {
                      try {
                          JSONObject root = getRoot(ctx);
                          JSONObject folders = root.optJSONObject("folders");
                          if (folders == null) { folders = new JSONObject(); root.put("folders", folders); }
                          JSONObject folder = folders.optJSONObject(folderName);
                          if (folder == null) { folder = new JSONObject(); folders.put(folderName, folder); }
                          JSONArray arr = new JSONArray();
                          for (StepItem s : steps) arr.put(s.toJson());
                          folder.put(profileName, arr);
                          saveRoot(ctx, root);
                      } catch (Exception ignored) {}
                  }

                  public static List<StepItem> loadProfile(Context ctx, String folderName, String profileName) {
                      List<StepItem> list = new ArrayList<>();
                      JSONObject folders = getRoot(ctx).optJSONObject("folders");
                      if (folders != null) {
                          JSONObject folder = folders.optJSONObject(folderName);
                          if (folder != null) {
                              JSONArray arr = folder.optJSONArray(profileName);
                              if (arr != null) {
                                  for (int i = 0; i < arr.length(); i++) {
                                      JSONObject o = arr.optJSONObject(i);
                                      if (o != null) list.add(StepItem.fromJson(o));
                                  }
                              }
                          }
                      }
                      return list;
                  }

                  public static void deleteProfile(Context ctx, String folderName, String profileName) {
                      try {
                          JSONObject root = getRoot(ctx);
                          JSONObject folders = root.optJSONObject("folders");
                          if (folders != null) {
                              JSONObject folder = folders.optJSONObject(folderName);
                              if (folder != null) {
                                  folder.remove(profileName);
                                  saveRoot(ctx, root);
                              }
                          }
                      } catch (Exception ignored) {}
                  }
              }
