                  private SeekBar addInteractiveSeekBar(LinearLayout parent, final String label, final int min, int max, int current, final SeekListener listener) {
                      final TextView tv = new TextView(this);
                      tv.setText(label + " [" + current + "]");
                      tv.setTextColor(Color.parseColor("#E4E4E7"));
                      tv.setTextSize(12);
                      tv.setPadding(0, 14, 0, 4);
                      parent.addView(tv);
                      SeekBar sb = new SeekBar(this);
                      sb.setMax(max - min);
                      sb.setProgress(Math.max(0, current - min));
                      sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                          @Override
                          public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                              int val = min + progress;
                              tv.setText(label + " [" + val + "]");
                              listener.onChange(val);
                          }
                          @Override public void onStartTrackingTouch(SeekBar seekBar) {}
                          @Override public void onStopTrackingTouch(SeekBar seekBar) {}
                      });
                      parent.addView(sb);
                      return sb;
                  }
