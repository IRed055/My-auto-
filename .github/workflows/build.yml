                  private void loadScenarioSteps(List<StepItem> loaded) {
                      for (StepItem old : steps) removeStepViews(old);
                      steps.clear();
                      for (StepItem s : loaded) {
                          createStepViews(s);
                          steps.add(s);
                      }
                      normalizeStepNumbers();
                      applyVisibilityRules();
                      updateHudText("Red Clicker | تم تحميل " + steps.size() + " خطوة");
                  }

                  private List<Integer> getSortedUniqueSteps() {
                      List<Integer> unique = new ArrayList<>();
                      for (StepItem s : steps) {
                          if (!unique.contains(s.stepNum)) unique.add(s.stepNum);
                      }
                      Collections.sort(unique);
                      return unique;
                  }

                  private void startScenario(int startGroupIdx) {
                      if (steps.isEmpty()) {
                          Toast.makeText(this, "أضف خطوات أولاً من زر (+)", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      for (StepItem s : steps) s.currentJumpCount = 0;
                      isRunning = true;
                      isPaused = false;
                      currentGroupIndex = startGroupIdx;
                      currentSubRepeat = 0;
                      currentLoopCycle = 1;
                      shrinkHandler.removeCallbacksAndMessages(null);
                      buildBarLayout.setVisibility(View.GONE);
                      bubbleView.setVisibility(View.GONE);
                      playBarLayout.setVisibility(View.VISIBLE);
                      btnPauseResume.setText("⏸");
                      setMarkersTouchable(false);
                      runCurrentGroup();
                  }

                  private void startScenarioFromStepNum(int stepNum) {
                      List<Integer> unique = getSortedUniqueSteps();
                      int idx = unique.indexOf(stepNum);
                      startScenario(Math.max(0, idx));
                  }

                  private void togglePauseResume() {
                      if (!isRunning) return;
                      isPaused = !isPaused;
                      btnPauseResume.setText(isPaused ? "▶" : "⏸");
                      if (isPaused) {
                          handler.removeCallbacksAndMessages(null);
                          clearAllHighlights();
                          updateHudText("مؤقت ⏸ | خطوة " + (currentGroupIndex + 1));
                      } else {
                          runCurrentGroup();
                      }
                  }

                  private void skipCurrentStep() {
                      if (!isRunning) return;
                      handler.removeCallbacksAndMessages(null);
                      clearAllHighlights();
                      currentSubRepeat = 0;
                      currentGroupIndex++;
                      runCurrentGroup();
                  }

                  private void stopScenario() {
                      isRunning = false;
                      isPaused = false;
                      handler.removeCallbacksAndMessages(null);
                      clearAllHighlights();
                      setMarkersTouchable(true);
                      playBarLayout.setVisibility(View.GONE);
                      buildBarLayout.setVisibility(View.VISIBLE);
                      updateHudText("توقف ⏹ | جاهز");
                      scheduleAutoShrink();
                  }

                  private void setMarkersTouchable(boolean touchable) {
                      for (StepItem s : steps) {
                          int flags = touchable
                              ? WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                              : (WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE);
                          if (s.primaryView != null && s.primaryParams != null) {
                              s.primaryParams.flags = flags;
                              wm.updateViewLayout(s.primaryView, s.primaryParams);
                          }
                          if (s.secondaryView != null && s.secondaryParams != null) {
                              s.secondaryParams.flags = flags;
                              wm.updateViewLayout(s.secondaryView, s.secondaryParams);
                          }
                      }
                  }

                  private void clearAllHighlights() {
                      for (StepItem s : steps) {
                          if (s.primaryView != null) s.primaryView.setHighlighted(false);
                          if (s.secondaryView != null) s.secondaryView.setHighlighted(false);
                      }
                  }

                  private void runCurrentGroup() {
                      if (!isRunning || isPaused || steps.isEmpty()) return;

                      final List<Integer> uniqueSteps = getSortedUniqueSteps();
                      if (currentGroupIndex >= uniqueSteps.size()) {
                          currentGroupIndex = 0;
                          currentSubRepeat = 0;
                          currentLoopCycle++;
                          for (StepItem s : steps) s.currentJumpCount = 0;
                      }

                      final int stepNum = uniqueSteps.get(currentGroupIndex);
                      final List<StepItem> group = new ArrayList<>();
                      for (StepItem s : steps) {
                          if (s.stepNum == stepNum) group.add(s);
                      }

                      final StepItem leader = group.get(0);
                      final int totalReps = Math.max(1, leader.repeatCount);
                      updateHudText("خطوة " + stepNum + "/" + uniqueSteps.size() + (totalReps > 1 ? " (تكرار " + (currentSubRepeat + 1) + "/" + totalReps + ")" : "") + " | دورة " + currentLoopCycle);

                      SharedPreferences prefs = getSharedPreferences("ClickerPrefs", MODE_PRIVATE);
                      final int defRandPx = prefs.getInt("def_rand_px", 11);
                      final int defRandMs = prefs.getInt("def_rand_ms", 35);
                      final int defRandDur = prefs.getInt("def_rand_dur", 15);

                      int leaderRandMs = leader.useCustomRandom ? leader.customRandMs : defRandMs;
                      int waitMs = leader.delayMs;
                      if (leader.useRandom && leaderRandMs > 0) {
                          waitMs += random.nextInt(leaderRandMs * 2 + 1) - leaderRandMs;
                      }
                      waitMs = Math.max(15, waitMs);

                      handler.postDelayed(() -> {
                          if (!isRunning || isPaused) return;

                          // فحص الشرط اللوني/البصري عند الطلب فقط إذا كان مفعلاً لهذه الخطوة
                          if (leader.useCondition) {
                              Bitmap bmp = captureSingleFrameOnDemand();
                              boolean matched = evaluateStepCondition(leader, bmp);
                              if (bmp != null) bmp.recycle();

                              if (matched) {
                                  if (leader.condOnSuccess == 1) {
                                      int tIdx = uniqueSteps.indexOf(leader.condSuccessJumpStep);
                                      currentGroupIndex = (tIdx >= 0) ? tIdx : 0;
                                      currentSubRepeat = 0;
                                      handler.postDelayed(this::runCurrentGroup, 50);
                                      return;
                                  }
                              } else {
                                  if (leader.condOnFail == 0) {
                                      currentSubRepeat = 0;
                                      currentGroupIndex++;
                                      handler.postDelayed(this::runCurrentGroup, 50);
                                      return;
                                  } else if (leader.condOnFail == 2) {
                                      int fIdx = uniqueSteps.indexOf(leader.condFailJumpStep);
                                      currentGroupIndex = (fIdx >= 0) ? fIdx : 0;
                                      currentSubRepeat = 0;
                                      handler.postDelayed(this::runCurrentGroup, 50);
                                      return;
                                  }
                              }
                          }

                          clearAllHighlights();
                          for (StepItem s : group) {
                              if (s.primaryView != null) s.primaryView.setHighlighted(true);
                              if (s.secondaryView != null) s.secondaryView.setHighlighted(true);
                          }

                          if (leader.type == StepItem.TYPE_JUMP) {
                              if (leader.currentJumpCount < leader.jumpRepeatCount) {
                                  leader.currentJumpCount++;
                                  int targetIdx = uniqueSteps.indexOf(leader.jumpTargetStep);
                                  currentGroupIndex = (targetIdx >= 0) ? targetIdx : 0;
                              } else {
                                  leader.currentJumpCount = 0;
                                  currentGroupIndex++;
                              }
                              currentSubRepeat = 0;
                              handler.postDelayed(this::runCurrentGroup, 60);
                              return;
                          }

                          DisplayMetrics dm = getResources().getDisplayMetrics();
                          int maxW = dm.widthPixels - 2;
                          int maxH = dm.heightPixels - 2;

                          GestureDescription.Builder builder = new GestureDescription.Builder();
                          int strokeCount = 0;

                          for (StepItem s : group) {
                              if (strokeCount >= 10) break;

                              int sRandPx = s.useCustomRandom ? s.customRandPx : defRandPx;
                              int sRandDur = s.useCustomRandom ? s.customRandDur : defRandDur;

                              int[] loc1 = new int[2];
                              s.primaryView.getLocationOnScreen(loc1);
                              float x1 = loc1[0] + (s.primaryView.getWidth() / 2f);
                              float y1 = loc1[1] + (s.primaryView.getHeight() / 2f);

                              if (s.useRandom && sRandPx > 0) {
                                  x1 += random.nextInt(sRandPx * 2 + 1) - sRandPx;
                                  y1 += random.nextInt(sRandPx * 2 + 1) - sRandPx;
                              }
                              x1 = Math.max(2f, Math.min(maxW, x1));
                              y1 = Math.max(2f, Math.min(maxH, y1));

                              int dur = s.durationMs;
                              if (s.useRandom && sRandDur > 0) {
                                  dur += random.nextInt(sRandDur * 2 + 1) - sRandDur;
                              }
                              dur = Math.max(20, dur);

                              if (s.type == StepItem.TYPE_TAP) {
                                  Path p = new Path();
                                  p.moveTo(x1, y1);
                                  builder.addStroke(new GestureDescription.StrokeDescription(p, 0, dur));
                                  strokeCount++;
                              } else if (s.type == StepItem.TYPE_SWIPE && s.secondaryView != null) {
                                  int[] loc2 = new int[2];
                                  s.secondaryView.getLocationOnScreen(loc2);
                                  float x2 = loc2[0] + (s.secondaryView.getWidth() / 2f);
                                  float y2 = loc2[1] + (s.secondaryView.getHeight() / 2f);
                                  if (s.useRandom && sRandPx > 0) {
                                      x2 += random.nextInt(sRandPx * 2 + 1) - sRandPx;
                                      y2 += random.nextInt(sRandPx * 2 + 1) - sRandPx;
                                  }
                                  x2 = Math.max(2f, Math.min(maxW, x2));
                                  y2 = Math.max(2f, Math.min(maxH, y2));

                                  Path p = new Path();
                                  p.moveTo(x1, y1);
                                  p.lineTo(x2, y2);
                                  builder.addStroke(new GestureDescription.StrokeDescription(p, 0, Math.max(80, dur)));
                                  strokeCount++;
                              } else if ((s.type == StepItem.TYPE_ZOOM_OUT || s.type == StepItem.TYPE_ZOOM_IN) && s.secondaryView != null && strokeCount <= 8) {
                                  int[] loc2 = new int[2];
                                  s.secondaryView.getLocationOnScreen(loc2);
                                  float x2 = Math.max(2f, Math.min(maxW, loc2[0] + (s.secondaryView.getWidth() / 2f)));
                                  float y2 = Math.max(2f, Math.min(maxH, loc2[1] + (s.secondaryView.getHeight() / 2f)));

                                  float midX = (x1 + x2) / 2f;
                                  float midY = (y1 + y2) / 2f;
                                  float innerX1 = midX + (x1 - midX) * 0.28f;
                                  float innerY1 = midY + (y1 - midY) * 0.28f;
                                  float innerX2 = midX + (x2 - midX) * 0.28f;
                                  float innerY2 = midY + (y2 - midY) * 0.28f;

                                  Path p1 = new Path();
                                  Path p2 = new Path();
                                  if (s.type == StepItem.TYPE_ZOOM_OUT) {
                                      p1.moveTo(x1, y1); p1.lineTo(innerX1, innerY1);
                                      p2.moveTo(x2, y2); p2.lineTo(innerX2, innerY2);
                                  } else {
                                      p1.moveTo(innerX1, innerY1); p1.lineTo(x1, y1);
                                      p2.moveTo(innerX2, innerY2); p2.lineTo(x2, y2);
                                  }
                                  int zDur = Math.max(120, dur);
                                  builder.addStroke(new GestureDescription.StrokeDescription(p1, 0, zDur));
                                  builder.addStroke(new GestureDescription.StrokeDescription(p2, 0, zDur));
                                  strokeCount += 2;
                              }
                          }

                          dispatchGesture(builder.build(), new GestureResultCallback() {
                              @Override
                              public void onCompleted(GestureDescription gestureDescription) {
                                  advanceAfterExecution(totalReps);
                              }
                              @Override
                              public void onCancelled(GestureDescription gestureDescription) {
                                  advanceAfterExecution(totalReps);
                              }
                          }, null);
                      }, waitMs);
                  }

                  private void advanceAfterExecution(int totalReps) {
                      clearAllHighlights();
                      currentSubRepeat++;
                      if (currentSubRepeat < totalReps) {
                          runCurrentGroup();
                      } else {
                          currentSubRepeat = 0;
                          currentGroupIndex++;
                          runCurrentGroup();
                      }
                  }

                  private LinearLayout createPopupContainer(String titleText) {
                      LinearLayout box = new LinearLayout(this);
                      box.setOrientation(LinearLayout.VERTICAL);
                      box.setPadding(28, 22, 28, 24);
                      GradientDrawable bg = new GradientDrawable();
                      bg.setColor(Color.parseColor("#F518181B"));
                      bg.setCornerRadius(26f);
                      bg.setStroke(3, Color.parseColor("#DC2626"));
                      box.setBackgroundDrawable(bg);
                      box.setClickable(true);

                      // شريط علوي يتضمن زر X فوق يسار وعنوان النافذة
                      LinearLayout topRow = new LinearLayout(this);
                      topRow.setOrientation(LinearLayout.HORIZONTAL);
                      topRow.setGravity(Gravity.CENTER_VERTICAL);
                      topRow.setPadding(0, 0, 0, 14);

                      TextView btnX = new TextView(this);
                      btnX.setText("✖");
                      btnX.setTextColor(Color.WHITE);
                      btnX.setTextSize(15);
                      btnX.setGravity(Gravity.CENTER);
                      GradientDrawable xBg = new GradientDrawable();
                      xBg.setShape(GradientDrawable.OVAL);
                      xBg.setColor(Color.parseColor("#DC2626"));
                      btnX.setBackgroundDrawable(xBg);
                      LinearLayout.LayoutParams xlp = new LinearLayout.LayoutParams(68, 68);
                      xlp.setMargins(0, 0, 16, 0);
                      btnX.setLayoutParams(xlp);
                      btnX.setOnClickListener(v -> saveAndDismissPopup());

                      TextView title = new TextView(this);
                      title.setText(titleText);
                      title.setTextColor(Color.WHITE);
                      title.setTextSize(15);
                      title.getPaint().setFakeBoldText(true);
                      title.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                      topRow.addView(btnX);
                      topRow.addView(title);
                      box.addView(topRow);
                      return box;
                  }

                  private EditText createPopupInput(LinearLayout parent, String label, String val, boolean numeric) {
                      TextView tv = new TextView(this);
                      tv.setText(label);
                      tv.setTextColor(Color.parseColor("#E4E4E7"));
                      tv.setTextSize(12);
                      tv.setPadding(0, 8, 0, 4);
                      parent.addView(tv);

                      EditText et = new EditText(this);
                      if (numeric) et.setInputType(InputType.TYPE_CLASS_NUMBER);
                      et.setText(val);
                      et.setTextColor(Color.WHITE);
                      GradientDrawable bg = new GradientDrawable();
                      bg.setColor(Color.parseColor("#27272A"));
                      bg.setCornerRadius(12f);
                      bg.setStroke(2, Color.parseColor("#3F3F46"));
                      et.setBackgroundDrawable(bg);
                      et.setPadding(18, 12, 18, 12);
                      parent.addView(et);
                      return et;
                  }

                  private Button createPopupButton(String text, String colorHex) {
                      Button b = new Button(this);
                      b.setText(text);
                      b.setTextColor(Color.WHITE);
                      b.setTextSize(13);
                      GradientDrawable bg = new GradientDrawable();
                      bg.setColor(Color.parseColor(colorHex));
                      bg.setCornerRadius(16f);
                      b.setBackgroundDrawable(bg);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(0, 7, 0, 5);
                      b.setLayoutParams(lp);
                      return b;
                  }

                  // نافذة منبثقة تدعم الحفظ التلقائي عند لمس الخلفية الخارجية أو سحب حافة الشاشة للرجوع
                  private void showPopupView(LinearLayout contentBox, final Runnable onAutoSave) {
                      dismissPopupDirect();
                      activePopupAutoSave = onAutoSave;

                      FrameLayout fullScreenBackdrop = new FrameLayout(this) {
                          @Override
                          public boolean dispatchKeyEvent(KeyEvent event) {
                              if (event.getKeyCode() == KeyEvent.KEYCODE_BACK && event.getAction() == KeyEvent.ACTION_UP) {
                                  saveAndDismissPopup();
                                  return true;
                              }
                              return super.dispatchKeyEvent(event);
                          }
                      };
                      fullScreenBackdrop.setBackgroundColor(Color.argb(145, 0, 0, 0));
                      fullScreenBackdrop.setFocusableInTouchMode(true);
                      fullScreenBackdrop.requestFocus();
                      fullScreenBackdrop.setOnClickListener(v -> saveAndDismissPopup());

                      ScrollView scroll = new ScrollView(this);
                      scroll.setClickable(true);
                      scroll.addView(contentBox);

                      DisplayMetrics dm = getResources().getDisplayMetrics();
                      FrameLayout.LayoutParams cardLp = new FrameLayout.LayoutParams(
                          (int) (dm.widthPixels * 0.90f),
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.CENTER);
                      fullScreenBackdrop.addView(scroll, cardLp);

                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT);
                      lp.gravity = Gravity.CENTER;

                      activePopupDialog = fullScreenBackdrop;
                      wm.addView(activePopupDialog, lp);
                  }

                  private void saveAndDismissPopup() {
                      if (activePopupAutoSave != null) {
                          try { activePopupAutoSave.run(); } catch (Exception ignored) {}
                          activePopupAutoSave = null;
                      }
                      dismissPopupDirect();
                  }

                  private void dismissPopupDirect() {
                      activePopupAutoSave = null;
                      if (activePopupDialog != null) {
                          try { wm.removeView(activePopupDialog); } catch (Exception ignored) {}
                          activePopupDialog = null;
                      }
                  }

                  private void closeAll() {
                      stopScenario();
                      dismissPopupDirect();
                      if (pickerOverlayView != null) {
                          try { wm.removeView(pickerOverlayView); } catch (Exception ignored) {}
                          pickerOverlayView = null;
                      }
                      if (freezeOverlayView != null) {
                          try { wm.removeView(freezeOverlayView); } catch (Exception ignored) {}
                          freezeOverlayView = null;
                          isGameTouchFrozen = false;
                      }
                      for (StepItem s : steps) removeStepViews(s);
                      steps.clear();
                      if (vectorOverlay != null) {
                          try { wm.removeView(vectorOverlay); } catch (Exception ignored) {}
                          vectorOverlay = null;
                      }
                      if (hudView != null) {
                          try { wm.removeView(hudView); } catch (Exception ignored) {}
                          hudView = null;
                      }
                      if (rootBarContainer != null) {
                          try { wm.removeView(rootBarContainer); } catch (Exception ignored) {}
                          rootBarContainer = null;
                      }
                  }

                  @Override
                  public void onAccessibilityEvent(AccessibilityEvent event) {
                      if (event == null || !isRunning) return;
                      SharedPreferences prefs = getSharedPreferences("ClickerPrefs", MODE_PRIVATE);
                      String pkg = event.getPackageName() != null ? event.getPackageName().toString().toLowerCase() : "";

                      if (event.getEventType() == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                          // التوقف المؤقت الفوري عند ورود اتصال هاتفي
                          if (prefs.getBoolean("pause_on_call", true) && !isPaused) {
                              if (pkg.contains("incallui") || pkg.contains("telecom") || pkg.contains("dialer") || pkg.contains("phone")) {
                                  togglePauseResume();
                                  Toast.makeText(this, "📞 تم إيقاف النقر مؤقتاً بسبب مكالمة هاتفية", Toast.LENGTH_LONG).show();
                                  return;
                              }
                          }
                          // إيقاف الطوارئ عند الخروج للشاشة الرئيسية
                          if (prefs.getBoolean("stop_on_home", false) && pkg.contains("launcher")) {
                              stopScenario();
                              return;
                          }
                      }

                      // التعامل مع الإشعارات العلوية أثناء التشغيل
                      if (event.getEventType() == AccessibilityEvent.TYPE_NOTIFICATION_STATE_CHANGED && !isPaused) {
                          if ( pkg.contains("smartclicker") || pkg.contains("systemui") ) return;
                          int notifMode = prefs.getInt("notif_mode", 1);
                          long now = System.currentTimeMillis();
                          if (now - lastNotifActionTime < 2500) return;
                          lastNotifActionTime = now;

                          if (notifMode == 1) {
                              // طرد الإشعار للأعلى ثم إكمال العمل
                              handler.removeCallbacksAndMessages(null);
                              DisplayMetrics dm = getResources().getDisplayMetrics();
                              Path swipeUp = new Path();
                              swipeUp.moveTo(dm.widthPixels / 2f, 220f);
                              swipeUp.lineTo(dm.widthPixels / 2f, 15f);
                              GestureDescription.Builder b = new GestureDescription.Builder();
                              b.addStroke(new GestureDescription.StrokeDescription(swipeUp, 0, 140));
                              dispatchGesture(b.build(), null, null);
                              handler.postDelayed(this::runCurrentGroup, 400);
                          } else if (notifMode == 2) {
                              // الانتظار الهادئ حتى يرتفع الإشعار وحده
                              handler.removeCallbacksAndMessages(null);
                              updateHudText("⏳ انتظار اختفاء الإشعار...");
                              handler.postDelayed(this::runCurrentGroup, 3500);
                          }
                      }
                  }

                  @Override public void onInterrupt() {}
              }
          """)
          PYEOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedAutoClicker-v3-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: "Red Auto Clicker v3.0 #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
