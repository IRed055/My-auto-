                  public void initScreenReader(int resultCode, Intent data) {
                      try {
                          if (virtualDisplay != null) { virtualDisplay.release(); virtualDisplay = null; }
                          if (imageReader != null) { imageReader.close(); imageReader = null; }
                          if (mediaProjection != null) { mediaProjection.stop(); mediaProjection = null; }
                          MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                          if (mpm != null) {
                              mediaProjection = mpm.getMediaProjection(resultCode, data);
                          }
                      } catch (Exception ignored) {}
                  }

                  private Bitmap captureSingleFrameOnDemand() {
                      if (mediaProjection == null) return null;
                      VirtualDisplay vd = null;
                      ImageReader ir = null;
                      try {
                          DisplayMetrics dm = getResources().getDisplayMetrics();
                          int w = dm.widthPixels;
                          int h = dm.heightPixels;
                          ir = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2);
                          vd = mediaProjection.createVirtualDisplay("RedOnDemand",
                              w, h, dm.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                              ir.getSurface(), null, null);
                          try { Thread.sleep(55); } catch (Exception ignored) {}
                          Image img = ir.acquireLatestImage();
                          if (img == null) return null;
                          Image.Plane[] planes = img.getPlanes();
                          ByteBuffer buffer = planes[0].getBuffer();
                          int pixelStride = planes[0].getPixelStride();
                          int rowStride = planes[0].getRowStride();
                          int rowPadding = rowStride - pixelStride * w;
                          Bitmap bmp = Bitmap.createBitmap(w + rowPadding / pixelStride, h, Bitmap.Config.ARGB_8888);
                          bmp.copyPixelsFromBuffer(buffer);
                          img.close();
                          return bmp;
                      } catch (Exception e) {
                          return null;
                      } finally {
                          try { if (vd != null) vd.release(); } catch (Exception ignored) {}
                          try { if (ir != null) ir.close(); } catch (Exception ignored) {}
                      }
                  }

