          write_file("app/src/main/java/com/smartclicker/app/TargetView.java", r"""
              package com.smartclicker.app;
              import android.content.Context;
              import android.content.SharedPreferences;
              import android.graphics.Canvas;
              import android.graphics.Color;
              import android.graphics.Paint;
              import android.view.View;
              public class TargetView extends View {
                  private final StepItem item;
                  private final boolean isSecondary;
                  private boolean highlighted = false;
                  private float customStrokeWidth = -1f;
                  private final Paint ringPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint outlinePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint fillPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint badgePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint textPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  public TargetView(Context context, StepItem item, boolean isSecondary) {
                      super(context);
                      this.item = item;
                      this.isSecondary = isSecondary;
                      ringPaint.setStyle(Paint.Style.STROKE);
                      outlinePaint.setStyle(Paint.Style.STROKE);
                      outlinePaint.setColor(Color.argb(180, 0, 0, 0));
                      fillPaint.setStyle(Paint.Style.FILL);
                      badgePaint.setStyle(Paint.Style.FILL);
                      badgePaint.setColor(Color.argb(150, 0, 0, 0));
                      textPaint.setColor(Color.WHITE);
                      textPaint.setTextSize(24f);
                      textPaint.setTextAlign(Paint.Align.CENTER);
                      textPaint.setFakeBoldText(true);
                      textPaint.setShadowLayer(5f, 0f, 0f, Color.BLACK);
                  }
                  public void setHighlighted(boolean h) {
                      if (this.highlighted != h) { this.highlighted = h; invalidate(); }
                  }
                  public void setCustomStrokeWidth(float sw) {
                      this.customStrokeWidth = sw; invalidate();
                  }
                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      float w = getWidth(), h = getHeight(), cx = w / 2f, cy = h / 2f;
                      float strokeW = customStrokeWidth;
                      if (strokeW <= 0f) {
                          SharedPreferences prefs = getContext().getSharedPreferences("ClickerPrefs", Context.MODE_PRIVATE);
                          strokeW = prefs.getInt("def_stroke_width", 5);
                      }
                      if (highlighted) strokeW += 2.5f;
                      float r = Math.min(w, h) / 2f - (strokeW / 2f) - 2f;
                      int baseColor;
                      if (highlighted) baseColor = Color.parseColor("#FFD700");
                      else {
                          switch (item.type) {
                              case StepItem.TYPE_SWIPE: baseColor = Color.parseColor("#10B981"); break;
                              case StepItem.TYPE_ZOOM_OUT: baseColor = Color.parseColor("#06B6D4"); break;
                              case StepItem.TYPE_ZOOM_IN: baseColor = Color.parseColor("#8B5CF6"); break;
                              case StepItem.TYPE_JUMP: baseColor = Color.parseColor("#F59E0B"); break;
                              case StepItem.TYPE_VISION_CHECK: baseColor = Color.parseColor("#EC4899"); break;
                              default: baseColor = Color.parseColor("#EF4444"); break;
                          }
                      }
                      fillPaint.setColor(highlighted ? Color.argb(145, 255, 215, 0) : Color.argb(48, Color.red(baseColor), Color.green(baseColor), Color.blue(baseColor)));
                      canvas.drawCircle(cx, cy, r, fillPaint);
                      outlinePaint.setStrokeWidth(strokeW + 2.5f);
                      canvas.drawCircle(cx, cy, r, outlinePaint);
                      ringPaint.setColor(baseColor);
                      ringPaint.setStrokeWidth(strokeW);
                      canvas.drawCircle(cx, cy, r, ringPaint);
                      float tickLen = r * 0.36f;
                      canvas.drawLine(cx - r, cy, cx - r + tickLen, cy, ringPaint);
                      canvas.drawLine(cx + r - tickLen, cy, cx + r, cy, ringPaint);
                      canvas.drawLine(cx, cy - r, cx, cy - r + tickLen, ringPaint);
                      canvas.drawLine(cx, cy + r - tickLen, cx, cy + r, ringPaint);
                      canvas.drawCircle(cx, cy, r * 0.44f, badgePaint);
                      String label = String.valueOf(item.stepNum);
                      if (item.type == StepItem.TYPE_SWIPE) label += isSecondary ? "E" : "S";
                      else if (item.type == StepItem.TYPE_ZOOM_OUT) label += isSecondary ? "B-" : "A-";
                      else if (item.type == StepItem.TYPE_ZOOM_IN) label += isSecondary ? "B+" : "A+";
                      else if (item.type == StepItem.TYPE_JUMP) label += "↺";
                      else if (item.type == StepItem.TYPE_VISION_CHECK || (item.useCondition && !isSecondary)) label += "👁";
                      textPaint.setTextSize(Math.max(18f, Math.min(w, h) * 0.25f));
                      textPaint.setColor(highlighted ? Color.YELLOW : Color.WHITE);
                      Paint.FontMetrics fm = textPaint.getFontMetrics();
                      canvas.drawText(label, cx, cy - (fm.ascent + fm.descent) / 2f, textPaint);
                  }
              }
          """)
          write_file("app/src/main/java/com/smartclicker/app/VectorOverlayView.java", r"""
              package com.smartclicker.app;
              import android.content.Context;
              import android.content.SharedPreferences;
              import android.graphics.Canvas;
              import android.graphics.Color;
              import android.graphics.Paint;
              import android.graphics.Path;
              import android.view.View;
              import java.util.List;
              public class VectorOverlayView extends View {
                  private final List<StepItem> steps;
                  private final Paint linePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint arrowPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  public VectorOverlayView(Context context, List<StepItem> steps) {
                      super(context);
                      this.steps = steps;
                      linePaint.setStyle(Paint.Style.STROKE);
                      arrowPaint.setStyle(Paint.Style.FILL);
                  }
                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      if (steps == null) return;
                      SharedPreferences prefs = getContext().getSharedPreferences("ClickerPrefs", Context.MODE_PRIVATE);
                      linePaint.setStrokeWidth(Math.max(2.5f, prefs.getInt("def_stroke_width", 5) * 0.75f));
                      int[] myLoc = new int[2];
                      getLocationOnScreen(myLoc);
                      for (StepItem s : steps) {
                          if (!s.hasSecondaryPoint() || s.primaryView == null || s.secondaryView == null) continue;
                          if (s.primaryView.getVisibility() != View.VISIBLE) continue;
                          int[] p1 = new int[2], p2 = new int[2];
                          s.primaryView.getLocationOnScreen(p1);
                          s.secondaryView.getLocationOnScreen(p2);
                          float x1 = p1[0] - myLoc[0] + s.primaryView.getWidth() / 2f;
                          float y1 = p1[1] - myLoc[1] + s.primaryView.getHeight() / 2f;
                          float x2 = p2[0] - myLoc[0] + s.secondaryView.getWidth() / 2f;
                          float y2 = p2[1] - myLoc[1] + s.secondaryView.getHeight() / 2f;
                          if (s.type == StepItem.TYPE_SWIPE) {
                              int c = Color.argb(190, 16, 185, 129);
                              linePaint.setColor(c); arrowPaint.setColor(c);
                              canvas.drawLine(x1, y1, x2, y2, linePaint);
                              drawArrowHead(canvas, x1, y1, (x1 + x2) / 2f, (y1 + y2) / 2f, 18f);
                              drawArrowHead(canvas, x1, y1, x2, y2, 21f);
                          } else if (s.type == StepItem.TYPE_ZOOM_OUT) {
                              int c = Color.argb(190, 6, 182, 212);
                              linePaint.setColor(c); arrowPaint.setColor(c);
                              canvas.drawLine(x1, y1, x2, y2, linePaint);
                              float mx = (x1 + x2) / 2f, my = (y1 + y2) / 2f;
                              drawArrowHead(canvas, x1, y1, mx, my, 19f);
                              drawArrowHead(canvas, x2, y2, mx, my, 19f);
                          } else if (s.type == StepItem.TYPE_ZOOM_IN) {
                              int c = Color.argb(190, 139, 92, 246);
                              linePaint.setColor(c); arrowPaint.setColor(c);
                              canvas.drawLine(x1, y1, x2, y2, linePaint);
                              float mx = (x1 + x2) / 2f, my = (y1 + y2) / 2f;
                              drawArrowHead(canvas, mx, my, (mx + x1) / 2f, (my + y1) / 2f, 19f);
                              drawArrowHead(canvas, mx, my, (mx + x2) / 2f, (my + y2) / 2f, 19f);
                          }
                      }
                  }
                  private void drawArrowHead(Canvas canvas, float fromX, float fromY, float toX, float toY, float size) {
                      double angle = Math.atan2(toY - fromY, toX - fromX);
                      Path path = new Path();
                      path.moveTo(toX, toY);
                      path.lineTo((float) (toX - size * Math.cos(angle - Math.PI / 6)), (float) (toY - size * Math.sin(angle - Math.PI / 6)));
                      path.lineTo((float) (toX - size * Math.cos(angle + Math.PI / 6)), (float) (toY - size * Math.sin(angle + Math.PI / 6)));
                      path.close();
                      canvas.drawPath(path, arrowPaint);
                  }
              }
