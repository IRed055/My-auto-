                              freezeOverlayView = new View(this);
                              freezeOverlayView.setBackgroundColor(Color.argb(25, 0, 180, 255));
                              WindowManager.LayoutParams fp = new WindowManager.LayoutParams(
                                  WindowManager.LayoutParams.MATCH_PARENT,
                                  WindowManager.LayoutParams.MATCH_PARENT,
                                  WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                                  PixelFormat.TRANSLUCENT);
                              wm.addView(freezeOverlayView, fp);
                              wm.removeView(rootBarContainer);
                              wm.addView(rootBarContainer, barParams);
                          }
                          Toast.makeText(this, "تم تجميد الشاشة الخلفية للبناء براحة", Toast.LENGTH_SHORT).show();
