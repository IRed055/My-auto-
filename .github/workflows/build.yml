                                 int areaA = VisionHelper.estimateAreaMatchPct(bmp, item.condAX1, item.condAY1, item.condABoxW, item.condABoxH, item.condAColor, item.condAGrid, item.condATol);
                                 msg.append("\n📊 تطابق مربع A: ").append(areaA).append("% (المطلوب >= ").append(item.condAAreaPct).append("%)");
                             } else if (item.condAMode == 3) {
                                 msg.append("\n🔢 الرقم المقروء في A: ").append(valA >= 0 ? valA : "لم يُقرأ").append(" (المتوقع: ").append(item.condAOcrExpected).append(")");
                             }
                             if (item.condLogic > 0) {
                                 if (item.condBMode == 2) {
                                     int fillB = VisionHelper.estimateBarFillPct(bmp, item.condBX1, item.condBY1, item.condBX2, item.condBY2, item.condBColor, item.condBTol);
                                     msg.append("\n📊 امتلاء شريط B: ").append(fillB).append("% (المطلوب >= ").append(item.condBBarPct).append("%)");
                                 } else if (item.condBMode == 1) {
                                     int areaB = VisionHelper.estimateAreaMatchPct(bmp, item.condBX1, item.condBY1, item.condBBoxW, item.condBBoxH, item.condBColor, item.condBGrid, item.condBTol);
                                     msg.append("\n📊 تطابق مربع B: ").append(areaB).append("% (المطلوب >= ").append(item.condBAreaPct).append("%)");
                                 } else if (item.condBMode == 3) {
                                     msg.append("\n🔢 الرقم المقروء في B: ").append(valB >= 0 ? valB : "لم يُقرأ").append(" (المتوقع: ").append(item.condBOcrExpected).append(")");
                                 }
                             }
                             bmp.recycle();
                             tvTestResultBox.setText(msg.toString());
                             tvTestResultBox.setTextColor(overall ? Color.parseColor("#34D399") : Color.parseColor("#F87171"));
                         });
                     })));
                 });
                 box.addView(bTestNow);
                 Button bDone = createPopupButton("💾 حفظ والعودة لإعدادات الخطوة", "#16A34A");
                 bDone.setOnClickListener(v -> {
                     saveAllCond.run();
                     activePopupAutoSave = null;
                     showEditStepDialog(item);
                 });
                 box.addView(bDone);
                 showPopupView(box, saveAllCond);
             }
             private Runnable buildSubConditionUI(LinearLayout parent, final StepItem item, final boolean isB, final Runnable onBeforePick) {
                 LinearLayout card = new LinearLayout(this);
                 card.setOrientation(LinearLayout.VERTICAL);
                 card.setPadding(18, 14, 18, 14);
                 GradientDrawable cBg = new GradientDrawable();
                 cBg.setColor(Color.parseColor("#222226"));
                 cBg.setCornerRadius(16f);
                 cBg.setStroke(2, Color.parseColor(isB ? "#10B981" : "#0891B2"));
                 card.setBackgroundDrawable(cBg);
                 LinearLayout.LayoutParams clp = new LinearLayout.LayoutParams(
                     LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                 clp.setMargins(0, 10, 0, 10);
                 card.setLayoutParams(clp);
                 String labelPrefix = isB ? "الشرط (B)" : "الشرط (A)";
                 final String[] modeNames = {
                     labelPrefix + " - النوع: فحص نقطة لون واحدة (اضغط للتغيير)",
                     labelPrefix + " - النوع: فحص منطقة / مربع بكسلات (اضغط للتغيير)",
                     labelPrefix + " - النوع: قياس امتلاء شريط بالمسطرة (اضغط للتغيير)",
                     labelPrefix + " - النوع: قراءة أرقام OCR (اضغط للتغيير)"
                 };
                 final LinearLayout pixelBox = new LinearLayout(this);
                 pixelBox.setOrientation(LinearLayout.VERTICAL);
                 final LinearLayout areaBox = new LinearLayout(this);
                 areaBox.setOrientation(LinearLayout.VERTICAL);
                 final LinearLayout barBox = new LinearLayout(this);
                 barBox.setOrientation(LinearLayout.VERTICAL);
                 final LinearLayout ocrBox = new LinearLayout(this);
                 ocrBox.setOrientation(LinearLayout.VERTICAL);
                 int curMode = isB ? item.condBMode : item.condAMode;
                 final Button bMode = createPopupButton(modeNames[curMode % 4], isB ? "#059669" : "#0E7490");
                 bMode.setOnClickListener(v -> {
                     int m = isB ? ((item.condBMode + 1) % 4) : ((item.condAMode + 1) % 4);
                     if (isB) item.condBMode = m; else item.condAMode = m;
                     bMode.setText(modeNames[m]);
                     pixelBox.setVisibility(m == 0 ? View.VISIBLE : View.GONE);
                     areaBox.setVisibility(m == 1 ? View.VISIBLE : View.GONE);
                     barBox.setVisibility(m == 2 ? View.VISIBLE : View.GONE);
                     ocrBox.setVisibility(m == 3 ? View.VISIBLE : View.GONE);
                 });
                 card.addView(bMode);
                 int savedCol = isB ? item.condBColor : item.condAColor;
                 boolean isPicked = isB ? item.condBColorPicked : item.condAColorPicked;
                 int x1 = isB ? item.condBX1 : item.condAX1;
                 int y1 = isB ? item.condBY1 : item.condAY1;
                 int x2 = isB ? item.condBX2 : item.condAX2;
                 int y2 = isB ? item.condBY2 : item.condAY2;
                 int bw = isB ? item.condBBoxW : item.condABoxW;
                 int bh = isB ? item.condBBoxH : item.condABoxH;
                 pixelBox.setVisibility(curMode == 0 ? View.VISIBLE : View.GONE);
                 LinearLayout pxRow = new LinearLayout(this);
                 pxRow.setOrientation(LinearLayout.HORIZONTAL);
                 pxRow.setGravity(Gravity.CENTER_VERTICAL);
                 View pxSwatch = createColorSwatchView(savedCol, isPicked);
                 pxRow.addView(pxSwatch);
                 Button bPickPx = createPopupButton(
                     isPicked ? "🎯 تغيير البكسل واللون (" + x1 + "," + y1 + ")" : "🎯 تحديد البكسل واللون بالمنظار", "#2563EB");
                 bPickPx.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                 bPickPx.setOnClickListener(v -> {
                     onBeforePick.run();
                     launchVisionPicker(item, isB, 0);
                 });
                 pxRow.addView(bPickPx);
                 pixelBox.addView(pxRow);
                 card.addView(pixelBox);
                 areaBox.setVisibility(curMode == 1 ? View.VISIBLE : View.GONE);
                 LinearLayout arRow = new LinearLayout(this);
                 arRow.setOrientation(LinearLayout.HORIZONTAL);
                 arRow.setGravity(Gravity.CENTER_VERTICAL);
                 View arSwatch = createColorSwatchView(savedCol, isPicked);
                 arRow.addView(arSwatch);
                 Button bPickArea = createPopupButton("🔲 تحديد مربع المنطقة من الشاشة (" + bw + "x" + bh + ")", "#2563EB");
                 bPickArea.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                 bPickArea.setOnClickListener(v -> {
                     onBeforePick.run();
                     launchVisionPicker(item, isB, 1);
                 });
                 arRow.addView(bPickArea);
                 areaBox.addView(arRow);
                 final EditText etAreaPct = createPopupInput(areaBox, "نسبة تطابق البكسلات المطلوبة داخل المربع % (مثلاً 70):",
                     String.valueOf(isB ? item.condBAreaPct : item.condAAreaPct), true, false);
                 card.addView(areaBox);
                 barBox.setVisibility(curMode == 2 ? View.VISIBLE : View.GONE);
                 LinearLayout brColorRow = new LinearLayout(this);
                 brColorRow.setOrientation(LinearLayout.HORIZONTAL);
                 brColorRow.setGravity(Gravity.CENTER_VERTICAL);
                 View brSwatch = createColorSwatchView(savedCol, isPicked);
                 brColorRow.addView(brSwatch);
                 Button bPickBarCol = createPopupButton(
                     isPicked ? "🎨 1. تغيير لون امتلاء الشريط المحفوظ" : "🎨 1. تحديد لون الجزء الممتلئ من الشريط", "#2563EB");
                 bPickBarCol.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                 bPickBarCol.setOnClickListener(v -> {
                     onBeforePick.run();
                     launchVisionPicker(item, isB, 2);
                 });
                 brColorRow.addView(bPickBarCol);
                 barBox.addView(brColorRow);
                 Button bPickRuler = createPopupButton(
                     "📏 2. تحديد مسطرة الشريط A(" + x1 + "," + y1 + ") ➔ B(" + x2 + "," + y2 + ")", "#0891B2");
                 bPickRuler.setOnClickListener(v -> {
                     onBeforePick.run();
                     launchVisionPicker(item, isB, 3);
                 });
                 barBox.addView(bPickRuler);
                 final EditText etBarPct = createPopupInput(barBox, "نسبة الامتلاء المطلوبة أو أعلى % (مثلاً 90):",
                     String.valueOf(isB ? item.condBBarPct : item.condABarPct), true, false);
                 card.addView(barBox);
                 ocrBox.setVisibility(curMode == 3 ? View.VISIBLE : View.GONE);
                 int ocrCx = isB ? item.condBOcrCx : item.condAOcrCx;
                 int ocrCy = isB ? item.condBOcrCy : item.condAOcrCy;
                 int ocrW = isB ? item.condBOcrW : item.condAOcrW;
                 int ocrH = isB ? item.condBOcrH : item.condAOcrH;
                 Button bPickOcr = createPopupButton("🔲 تحديد منطقة الأرقام (" + ocrW + "x" + ocrH + ")", "#F59E0B");
                 bPickOcr.setOnClickListener(v -> {
                     onBeforePick.run();
                     launchVisionPicker(item, isB, 4);
                 });
                 ocrBox.addView(bPickOcr);
                 final EditText etOcrExpected = createPopupInput(ocrBox, "الرقم المتوقع (مثلاً 1000000):", isB ? item.condBOcrExpected : item.condAOcrExpected, true, false);
                 final String[] opNames = {">= (أكبر أو يساوي)", "> (أكبر من)", "== (يساوي)", "<= (أصغر أو يساوي)", "< (أصغر من)", "!= (لا يساوي)"};
                 int curOp = isB ? item.condBOcrOperator : item.condAOcrOperator;
                 final Button bOcrOp = createPopupButton("العملية: " + opNames[curOp % 6], "#4B5563");
                 bOcrOp.setOnClickListener(v -> {
                     int o = isB ? item.condBOcrOperator : item.condAOcrOperator;
                     o = (o + 1) % 6;
                     if (isB) item.condBOcrOperator = o; else item.condAOcrOperator = o;
                     bOcrOp.setText("العملية: " + opNames[o]);
                 });
                 ocrBox.addView(bOcrOp);
                 card.addView(ocrBox);
                 final EditText etTol = createPopupInput(card, "دقة تقارب اللون المسموحة % (لغير OCR):",
                     String.valueOf(isB ? item.condBTol : item.condATol), true, false);
                 parent.addView(card);
                 return () -> {
                     try {
                         int tol = Math.max(50, Math.min(100, Integer.parseInt(etTol.getText().toString())));
                         int aPct = Math.max(5, Math.min(100, Integer.parseInt(etAreaPct.getText().toString())));
                         int bPct = Math.max(5, Math.min(100, Integer.parseInt(etBarPct.getText().toString())));
                         String exp = etOcrExpected.getText().toString().trim();
                         if (isB) {
                             item.condBTol = tol;
                             item.condBAreaPct = aPct;
                             item.condBBarPct = bPct;
                             item.condBOcrExpected = exp;
                         } else {
                             item.condATol = tol;
                             item.condAAreaPct = aPct;
                             item.condABarPct = bPct;
                             item.condAOcrExpected = exp;
                         }
                     } catch (Exception ignored) {}
                 };
             }
             private View createColorSwatchView(int color, boolean picked) {
                 TextView tv = new TextView(this);
                 tv.setText(picked ? "✔" : "?");
                 tv.setTextColor(Color.WHITE);
                 tv.setGravity(Gravity.CENTER);
                 GradientDrawable gd = new GradientDrawable();
                 gd.setColor(picked ? color : Color.parseColor("#3F3F46"));
                 gd.setCornerRadius(10f);
                 gd.setStroke(2, Color.WHITE);
                 tv.setBackgroundDrawable(gd);
                 LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(72, 68);
                 lp.setMargins(0, 0, 12, 0);
                 tv.setLayoutParams(lp);
                 return tv;
             }
             private void launchVisionPicker(final StepItem item, final boolean isB, final int pickerAction) {
                 activePopupAutoSave = null;
                 dismissPopupDirect();
                 if (rootBarContainer != null) rootBarContainer.setVisibility(View.GONE);
                 setAllMarkersVisibleTemp(false);
                 ScreenCaptureActivity.pendingActionAfterGrant = () -> launchVisionPicker(item, isB, pickerAction);
                 Choreographer.getInstance().postFrameCallback(frameTimeNanos -> Choreographer.getInstance().postFrameCallback(frameTimeNanos1 -> captureScreenAsync(true, frozen -> {
                     if (frozen == null) {
                         if (rootBarContainer != null) rootBarContainer.setVisibility(View.VISIBLE);
                         setAllMarkersVisibleTemp(true);
                         showConditionDialog(item);
                         return;
                     }
                     ScreenCaptureActivity.pendingActionAfterGrant = null;
                     int x1 = isB ? item.condBX1 : item.condAX1;
                     int y1 = isB ? item.condBY1 : item.condAY1;
                     int x2 = isB ? item.condBX2 : item.condAX2;
                     int y2 = isB ? item.condBY2 : item.condAY2;
                     int bw = isB ? item.condBBoxW : item.condABoxW;
                     int bh = isB ? item.condBBoxH : item.condABoxH;
                     if (pickerAction == 0 || pickerAction == 2) {
                         String hint = (pickerAction == 2)
                             ? "حرّك إصبعك فوق اللون الممتلئ للشريط ثم اضغط اعتماد:"
                             : "حرّك إصبعك لتحديد البكسل واللون بالمنظار ثم اضغط اعتماد:";
                         pickerOverlayView = VisionHelper.showLoupePicker(ClickerService.this, wm, frozen, x1, y1, hint, new VisionHelper.ColorPickCallback() {
                             @Override
                             public void onPicked(int px, int py, int col) {
                                 pickerOverlayView = null;
                                 if (frozen != null && !frozen.isRecycled()) frozen.recycle();
                                 if (rootBarContainer != null) rootBarContainer.setVisibility(View.VISIBLE);
                                 setAllMarkersVisibleTemp(true);
                                 if (isB) {
                                     if (pickerAction == 0) { item.condBX1 = px; item.condBY1 = py; }
                                     item.condBColor = col;
                                     item.condBColorPicked = true;
                                 } else {
                                     if (pickerAction == 0) { item.condAX1 = px; item.condAY1 = py; }
                                     item.condAColor = col;
                                     item.condAColorPicked = true;
                                 }
                                 showConditionDialog(item);
                             }
                             @Override
                             public void onCancel() {
                                 pickerOverlayView = null;
                                 if (frozen != null && !frozen.isRecycled()) frozen.recycle();
                                 if (rootBarContainer != null) rootBarContainer.setVisibility(View.VISIBLE);
                                 setAllMarkersVisibleTemp(true);
                                 showConditionDialog(item);
                             }
                         });
                     } else if (pickerAction == 1) {
                         pickerOverlayView = VisionHelper.showAreaBoxPicker(ClickerService.this, wm, frozen, x1, y1, bw, bh, new VisionHelper.AreaPickCallback() {
                             @Override
                             public void onPicked(int cx, int cy, int boxW, int boxH, int centerColor, String gridSig) {
                                 pickerOverlayView = null;
                                 if (frozen != null && !frozen.isRecycled()) frozen.recycle();
                                 if (rootBarContainer != null) rootBarContainer.setVisibility(View.VISIBLE);
                                 setAllMarkersVisibleTemp(true);
                                 if (isB) {
                                     item.condBX1 = cx; item.condBY1 = cy;
                                     item.condBBoxW = boxW; item.condBBoxH = boxH;
                                     item.condBColor = centerColor; item.condBColorPicked = true;
                                     item.condBGrid = gridSig;
                                 } else {
                                     item.condAX1 = cx; item.condAY1 = cy;
                                     item.condABoxW = boxW; item.condABoxH = boxH;
                                     item.condAColor = centerColor; item.condAColorPicked = true;
                                     item.condAGrid = gridSig;
                                 }
                                 showConditionDialog(item);
                             }
                             @Override
                             public void onCancel() {
                                 pickerOverlayView = null;
                                 if (frozen != null && !frozen.isRecycled()) frozen.recycle();
                                 if (rootBarContainer != null) rootBarContainer.setVisibility(View.VISIBLE);
                                 setAllMarkersVisibleTemp(true);
                                 showConditionDialog(item);
                             }
                         });
                     } else if (pickerAction == 3) {
                         pickerOverlayView = VisionHelper.showBarRulerPicker(ClickerService.this, wm, frozen, x1, y1, x2, y2, new VisionHelper.RulerPickCallback() {
                             @Override
                             public void onPicked(int ax, int ay, int bx, int by) {
                                 pickerOverlayView = null;
                                 if (frozen != null && !frozen.isRecycled()) frozen.recycle();
                                 if (rootBarContainer != null) rootBarContainer.setVisibility(View.VISIBLE);
                                 setAllMarkersVisibleTemp(true);
                                 if (isB) {
                                     item.condBX1 = ax; item.condBY1 = ay;
                                     item.condBX2 = bx; item.condBY2 = by;
                                 } else {
                                     item.condAX1 = ax; item.condAY1 = ay;
                                     item.condAX2 = bx; item.condAY2 = by;
                                 }
                                 showConditionDialog(item);
                             }
                             @Override
                             public void onCancel() {
                                 pickerOverlayView = null;
                                 if (frozen != null && !frozen.isRecycled()) frozen.recycle();
                                 if (rootBarContainer != null) rootBarContainer.setVisibility(View.VISIBLE);
                                 setAllMarkersVisibleTemp(true);
                                 showConditionDialog(item);
                             }
                         });
                     } else if (pickerAction == 4) {
                         int ocrW = isB ? item.condBOcrW : item.condAOcrW;
                         int ocrH = isB ? item.condBOcrH : item.condAOcrH;
                         int ocrCx = isB ? item.condBOcrCx : item.condAOcrCx;
                         int ocrCy = isB ? item.condBOcrCy : item.condAOcrCy;
                         pickerOverlayView = VisionHelper.showOcrBoxPicker(ClickerService.this, wm, frozen, ocrCx, ocrCy, ocrW, ocrH, new VisionHelper.OcrPickCallback() {
                             @Override
                             public void onPicked(int cx, int cy, int boxW, int boxH) {
                                 pickerOverlayView = null;
                                 if (frozen != null && !frozen.isRecycled()) frozen.recycle();
                                 if (rootBarContainer != null) rootBarContainer.setVisibility(View.VISIBLE);
                                 setAllMarkersVisibleTemp(true);
                                 if (isB) {
                                     item.condBOcrCx = cx; item.condBOcrCy = cy;
                                     item.condBOcrW = boxW; item.condBOcrH = boxH;
                                 } else {
                                     item.condAOcrCx = cx; item.condAOcrCy = cy;
                                     item.condAOcrW = boxW; item.condAOcrH = boxH;
                                 }
                                 showConditionDialog(item);
                             }
                             @Override
                             public void onCancel() {
                                 pickerOverlayView = null;
                                 if (frozen != null && !frozen.isRecycled()) frozen.recycle();
                                 if (rootBarContainer != null) rootBarContainer.setVisibility(View.VISIBLE);
                                 setAllMarkersVisibleTemp(true);
                                 showConditionDialog(item);
                             }
                         });
                     }
                 })));
             }
             private void setAllMarkersVisibleTemp(boolean show) {
                 if (!show) {
                     for (StepItem s : steps) {
                         if (s.primaryView != null) s.primaryView.setVisibility(View.GONE);
                         if (s.secondaryView != null) s.secondaryView.setVisibility(View.GONE);
                     }
                     if (vectorOverlay != null) vectorOverlay.setVisibility(View.GONE);
                     if (hudView != null) hudView.setVisibility(View.GONE);
                     if (rootBarContainer != null) rootBarContainer.setVisibility(View.GONE);
                 } else {
                     if (vectorOverlay != null) vectorOverlay.setVisibility(View.VISIBLE);
                     SharedPreferences prefs = getSharedPreferences("ClickerPrefs", MODE_PRIVATE);
                     if (hudView != null) {
                         hudView.setVisibility(prefs.getBoolean("show_hud", true) ? View.VISIBLE : View.GONE);
                     }
                     if (rootBarContainer != null) rootBarContainer.setVisibility(View.VISIBLE);
                     applyVisibilityRules();
                 }
             }
             private void showQuickNextSettingsDialog() {
                 final SharedPreferences prefs = getSharedPreferences("ClickerPrefs", MODE_PRIVATE);
                 LinearLayout box = createPopupContainer("⚙️ إعداد سريع شامل للخطوات القادمة");
                 final EditText etDel = createPopupInput(box, "وقت الانتظار قبل البدء للخطوات القادمة (ms):",
                     String.valueOf(prefs.getInt("def_delay", 300)), true, true);
                 final EditText etDur = createPopupInput(box, "مدة اللمس العادية للخطوات القادمة (ms):",
                     String.valueOf(prefs.getInt("def_duration", 60)), true, true);
                 final EditText etSwp = createPopupInput(box, "مدة السحب أو التكبير/التصغير للخطوات القادمة (ms):",
                     String.valueOf(prefs.getInt("def_swipe_dur", 350)), true, true);
                 final EditText etRep = createPopupInput(box, "عدد تكرارات العملية للخطوات القادمة (الافتراضي 1):",
                     String.valueOf(prefs.getInt("def_repeat", 1)), true, false);
                 LinearLayout randRow = new LinearLayout(this);
                 randRow.setOrientation(LinearLayout.HORIZONTAL);
                 randRow.setGravity(Gravity.CENTER_VERTICAL);
                 final CheckBox cbRand = new CheckBox(this);
                 cbRand.setText("تفعيل مكافحة الحظر للخطوات القادمة");
                 cbRand.setTextColor(Color.WHITE);
                 cbRand.setChecked(prefs.getBoolean("def_use_rand", true));
                 cbRand.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                 final LinearLayout customRandBox = new LinearLayout(this);
                 customRandBox.setOrientation(LinearLayout.VERTICAL);
                 customRandBox.setVisibility(View.GONE);
                 Button bToggleRand = createPopupButton("⋮ تخصيص", "#374151");
                 LinearLayout.LayoutParams trp = new LinearLayout.LayoutParams(
                     LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                 trp.setMargins(8, 4, 0, 4);
                 bToggleRand.setLayoutParams(trp);
                 bToggleRand.setOnClickListener(v -> {
                     boolean vis = customRandBox.getVisibility() == View.VISIBLE;
                     customRandBox.setVisibility(vis ? View.GONE : View.VISIBLE);
                 });
                 randRow.addView(cbRand);
                 randRow.addView(bToggleRand);
                 box.addView(randRow);
                 final EditText etRPx = createPopupInput(customRandBox, "نطاق انتشار البكسل للقادم (px):",
                     String.valueOf(prefs.getInt("def_rand_px", 11)), true, false);
                 final EditText etRMs = createPopupInput(customRandBox, "عشوائية الانتظار للقادم (ms):",
                     String.valueOf(prefs.getInt("def_rand_ms", 35)), true, false);
                 final EditText etRDur = createPopupInput(customRandBox, "عشوائية مدة اللمس للقادم (ms):",
                     String.valueOf(prefs.getInt("def_rand_dur", 15)), true, false);
                 box.addView(customRandBox);
                 Button bSave = createPopupButton("💾 اعتماد للخطوات القادمة", "#16A34A");
                 bSave.setOnClickListener(v -> {
                     try {
                         prefs.edit()
                             .putInt("def_delay", Math.max(10, Integer.parseInt(etDel.getText().toString())))
                             .putInt("def_duration", Math.max(15, Integer.parseInt(etDur.getText().toString())))
                             .putInt("def_swipe_dur", Math.max(50, Integer.parseInt(etSwp.getText().toString())))
                             .putInt("def_repeat", Math.max(1, Integer.parseInt(etRep.getText().toString())))
                             .putBoolean("def_use_rand", cbRand.isChecked())
                             .putInt("def_rand_px", Math.max(0, Integer.parseInt(etRPx.getText().toString())))
                             .putInt("def_rand_ms", Math.max(0, Integer.parseInt(etRMs.getText().toString())))
                             .putInt("def_rand_dur", Math.max(0, Integer.parseInt(etRDur.getText().toString())))
                             .commit();
                     } catch (Exception ignored) {}
                     saveAndDismissPopup();
                     showSingleToast("تم اعتماد الإعدادات للخطوات القادمة!");
                 });
                 box.addView(bSave);
