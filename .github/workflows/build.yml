                          saveCond.run();
                          activePopupAutoSave = null;
                          showEditStepDialog(item);
                      });
                      box.addView(bDone);

                      showPopupView(box, saveCond);
                  }

                  private void showScreenColorPicker(final StepItem item, final boolean isSecondPoint) {
                      if (pickerOverlayView != null) {
                          try { wm.removeView(pickerOverlayView); } catch (Exception ignored) {}
                      }
                      DisplayMetrics dm = getResources().getDisplayMetrics();
                      final int[] targetXY = new int[]{
                          isSecondPoint ? item.condX2 : item.condX,
                          isSecondPoint ? item.condY2 : item.condY
                      };

                      FrameLayout layer = new FrameLayout(this);

                      final TextView cross = new TextView(this);
                      cross.setText("🎯");
                      cross.setTextSize(26);
                      cross.setGravity(Gravity.CENTER);
                      GradientDrawable cBg = new GradientDrawable();
                      cBg.setShape(GradientDrawable.OVAL);
                      cBg.setColor(Color.argb(90, 0, 0, 0));
                      cBg.setStroke(4, Color.YELLOW);
                      cross.setBackgroundDrawable(cBg);

                      final FrameLayout.LayoutParams clp = new FrameLayout.LayoutParams(110, 110);
                      clp.gravity = Gravity.TOP | Gravity.START;
                      clp.leftMargin = Math.max(0, targetXY[0] - 55);
                      clp.topMargin = Math.max(0, targetXY[1] - 55);
                      layer.addView(cross, clp);

                      LinearLayout panel = new LinearLayout(this);
                      panel.setOrientation(LinearLayout.HORIZONTAL);
                      panel.setPadding(20, 14, 20, 14);
                      panel.setBackgroundColor(Color.parseColor("#EE18181B"));

                      TextView info = new TextView(this);
                      info.setText("حرّك العدسة 🎯 فوق المكان المطلوب ثم اضغط تأكيد:");
                      info.setTextColor(Color.WHITE);
                      info.setTextSize(12);
                      info.setPadding(10, 0, 16, 0);
                      panel.addView(info);

                      Button bConfirm = createPopupButton("✅ تأكيد والتقاط اللون", "#16A34A");
                      bConfirm.setLayoutParams(new LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                      bConfirm.setOnClickListener(v -> {
                          int px = clp.leftMargin + 55;
                          int py = clp.topMargin + 55;
                          if (pickerOverlayView != null) {
                              try { wm.removeView(pickerOverlayView); } catch (Exception ignored) {}
                              pickerOverlayView = null;
                          }
                          Bitmap bmp = captureSingleFrameOnDemand();
                          int pickedColor = Color.rgb(255, 200, 0);
                          if (bmp != null) {
                              int safeX = Math.max(0, Math.min(bmp.getWidth() - 1, px));
                              int safeY = Math.max(0, Math.min(bmp.getHeight() - 1, py));
                              pickedColor = bmp.getPixel(safeX, safeY);
                              bmp.recycle();
                              Toast.makeText(this, "تم التقاط اللون والمكان بنجاح!", Toast.LENGTH_SHORT).show();
                          } else {
                              Toast.makeText(this, "تم حفظ المكان! (فعّل الزر 2 في الرئيسية لقراءة اللون الدقيق)", Toast.LENGTH_LONG).show();
                          }
                          if (isSecondPoint) {
                              item.condX2 = px; item.condY2 = py; item.condColor2 = pickedColor;
                          } else {
                              item.condX = px; item.condY = py; item.condColor = pickedColor;
                          }
                          showConditionDialog(item);
                      });
                      panel.addView(bConfirm);

                      FrameLayout.LayoutParams plp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT);
                      plp.gravity = Gravity.BOTTOM;
                      layer.addView(panel, plp);

                      cross.setOnTouchListener(new View.OnTouchListener() {
                          int initX, initY;
                          float tx, ty;
                          @Override
                          public boolean onTouch(View v, MotionEvent e) {
                              if (e.getAction() == MotionEvent.ACTION_DOWN) {
                                  initX = clp.leftMargin; initY = clp.topMargin;
                                  tx = e.getRawX(); ty = e.getRawY();
                                  return true;
                              } else if (e.getAction() == MotionEvent.ACTION_MOVE) {
                                  clp.leftMargin = Math.max(0, Math.min(dm.widthPixels - 110, initX + (int) (e.getRawX() - tx)));
                                  clp.topMargin = Math.max(0, Math.min(dm.heightPixels - 110, initY + (int) (e.getRawY() - ty)));
                                  layer.updateViewLayout(cross, clp);
                                  return true;
                              }
                              return false;
                          }
                      });

                      WindowManager.LayoutParams olp = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT);
                      pickerOverlayView = layer;
                      wm.addView(pickerOverlayView, olp);
                  }

                  private boolean evaluateStepCondition(StepItem s, Bitmap bmp) {
                      if (bmp == null) return true;
                      if (s.condMode == 2) {
                          // فحص نسبة امتلاء الشريط بين النقطة 1 والنقطة 2
                          float ratio = s.condBarPct / 100f;
                          int checkX = (int) (s.condX + (s.condX2 - s.condX) * ratio);
                          int checkY = (int) (s.condY + (s.condY2 - s.condY) * ratio);
                          return matchPixelOrBox(bmp, checkX, checkY, s.condColor, s.condTolerance, false);
                      }
                      boolean boxMode = (s.condMode == 1);
                      boolean c1 = matchPixelOrBox(bmp, s.condX, s.condY, s.condColor, s.condTolerance, boxMode);
                      if (!s.useSecondCond) return c1;
                      boolean c2 = matchPixelOrBox(bmp, s.condX2, s.condY2, s.condColor2, s.condTolerance, boxMode);
                      return s.condLogicAnd ? (c1 && c2) : (c1 || c2);
                  }

                  private boolean matchPixelOrBox(Bitmap bmp, int x, int y, int targetColor, int tolerancePct, boolean boxMode) {
                      int w = bmp.getWidth();
                      int h = bmp.getHeight();
                      int radius = boxMode ? 6 : 1;
                      int matched = 0;
                      int total = 0;
                      for (int dx = -radius; dx <= radius; dx += 2) {
                          for (int dy = -radius; dy <= radius; dy += 2) {
                              int px = Math.max(0, Math.min(w - 1, x + dx));
                              int py = Math.max(0, Math.min(h - 1, y + dy));
                              int c = bmp.getPixel(px, py);
                              if (colorSimilarityPct(c, targetColor) >= tolerancePct) matched++;
                              total++;
                          }
                      }
                      return boxMode ? (matched * 100 / Math.max(1, total) >= 60) : (matched > 0);
                  }

                  private int colorSimilarityPct(int c1, int c2) {
                      int dr = Math.abs(Color.red(c1) - Color.red(c2));
                      int dg = Math.abs(Color.green(c1) - Color.green(c2));
                      int db = Math.abs(Color.blue(c1) - Color.blue(c2));
                      double diff = (dr + dg + db) / (255.0 * 3.0);
                      return (int) Math.round((1.0 - diff) * 100.0);
                  }

