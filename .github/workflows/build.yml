                          } catch (Exception ignored) {}
                      };
                      Button bBack = createPopupButton("💾 حفظ والعودة لإعدادات الخطوة", "#16A34A");
                      bBack.setOnClickListener(v -> {
                          saveCustom.run();
                          activePopupAutoSave = null;
                          showEditStepDialog(item);
                      });
                      box.addView(bBack);
                      showPopupView(box, saveCustom);
