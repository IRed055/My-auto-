                      captureViaProjection(autoPromptIfMissing, cb);
                  }
                  private void captureViaProjection(final boolean autoPromptIfMissing, final FrameCallback cb) {
                      if (mediaProjection == null) {
                          if (autoPromptIfMissing) {
                              showSingleToast("يرجى الموافقة لتفعيل قراءة ألوان الشاشة الحقيقية");
                              Intent it = new Intent(this, ScreenCaptureActivity.class);
                              it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(it);
                          }
                          cb.onFrame(null);
                          return;
                      }
                      setupPersistentReader();
                      try {
                          for (int attempt = 0; attempt < 6; attempt++) {
                              if (persistentIR == null) break;
                              Image img = persistentIR.acquireLatestImage();
                              if (img != null) {
                                  Image.Plane[] planes = img.getPlanes();
                                  ByteBuffer buffer = planes[0].getBuffer();
                                  int pixelStride = planes[0].getPixelStride();
                                  int rowStride = planes[0].getRowStride();
                                  int rowPadding = rowStride - pixelStride * captureW;
                                  Bitmap bmp = Bitmap.createBitmap(captureW + rowPadding / pixelStride, captureH, Bitmap.Config.ARGB_8888);
                                  bmp.copyPixelsFromBuffer(buffer);
                                  img.close();
                                  if (bmp.getWidth() > captureW) {
                                      Bitmap cropped = Bitmap.createBitmap(bmp, 0, 0, captureW, captureH);
                                      bmp.recycle();
                                      cb.onFrame(cropped);
                                  } else {
                                      cb.onFrame(bmp);
                                  }
                                  return;
                              }
                              try { Thread.sleep(38); } catch (Exception ignored) {}
                          }
                      } catch (Exception ignored) {}
                      cb.onFrame(null);
                  }
