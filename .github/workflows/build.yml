name: Build Red Auto Clicker v2.0

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Red Auto Clicker v2.0 Files
        run: |
          rm -rf app build.gradle settings.gradle
          python3 - << 'PYEOF'
          import os, textwrap

          def write_file(path, content):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(textwrap.dedent(content).lstrip())

          write_file("settings.gradle", r"""
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "RedAutoClicker"
              include ':app'
          """)

          write_file("build.gradle", r"""
              plugins {
                  id 'com.android.application' version '8.2.2' apply false
              }
          """)

          write_file("app/build.gradle", r"""
              plugins {
                  id 'com.android.application'
              }
              android {
                  namespace 'com.smartclicker.app'
                  compileSdk 34
                  defaultConfig {
                      applicationId "com.smartclicker.app"
                      minSdk 24
                      targetSdk 34
                      versionCode 2
                      versionName "2.0"
                  }
                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_1_8
                      targetCompatibility JavaVersion.VERSION_1_8
                  }
              }
              dependencies {
              }
          """)

          write_file("app/src/main/res/values/strings.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <resources>
                  <string name="app_name">Red Auto Clicker</string>
                  <string name="acc_desc">Red Auto Clicker - خدمة النقر الذكي متعددة الطبقات والعمليات للألعاب</string>
              </resources>
          """)

          write_file("app/src/main/res/xml/accessibility_config.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
                  android:accessibilityEventTypes="typeWindowStateChanged|typeNotificationStateChanged"
                  android:accessibilityFeedbackType="feedbackGeneric"
                  android:accessibilityFlags="flagDefault"
                  android:canPerformGestures="true"
                  android:canRetrieveWindowContent="true"
                  android:description="@string/acc_desc" />
          """)

          write_file("app/src/main/AndroidManifest.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
                  <application
                      android:label="@string/app_name"
                      android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                      <activity
                          android:name=".MainActivity"
                          android:exported="true">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                      <service
                          android:name=".ClickerService"
                          android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                          android:exported="true">
                          <intent-filter>
                              <action android:name="android.accessibilityservice.AccessibilityService" />
                          </intent-filter>
                          <meta-data
                              android:name="android.accessibilityservice"
                              android:resource="@xml/accessibility_config" />
                      </service>
                  </application>
              </manifest>
          """)

          write_file("app/src/main/java/com/smartclicker/app/StepItem.java", r"""
              package com.smartclicker.app;

              import android.view.WindowManager;
              import org.json.JSONObject;

              public class StepItem {
                  public static final int TYPE_TAP = 0;
                  public static final int TYPE_SWIPE = 1;
                  public static final int TYPE_ZOOM_OUT = 2;
                  public static final int TYPE_ZOOM_IN = 3;
                  public static final int TYPE_JUMP = 4;

                  public int stepNum = 1;
                  public int type = TYPE_TAP;
                  public String name = "";
                  public int x = 400;
                  public int y = 400;
                  public int x2 = 600;
                  public int y2 = 600;
                  public int delayMs = 300;
                  public int durationMs = 60;
                  public boolean useRandom = true;
                  public int jumpTargetStep = 1;
                  public int jumpRepeatCount = 3;
                  public transient int currentJumpCount = 0;

                  public transient TargetView primaryView;
                  public transient TargetView secondaryView;
                  public transient WindowManager.LayoutParams primaryParams;
                  public transient WindowManager.LayoutParams secondaryParams;

                  public String getTypeLabel() {
                      switch (type) {
                          case TYPE_SWIPE: return "سحب ⇄";
                          case TYPE_ZOOM_OUT: return "تصغير 🔍-";
                          case TYPE_ZOOM_IN: return "تكبير 🔍+";
                          case TYPE_JUMP: return "قفز ↺";
                          default: return "لمسة 🎯";
                      }
                  }

                  public boolean hasSecondaryPoint() {
                      return type == TYPE_SWIPE || type == TYPE_ZOOM_OUT || type == TYPE_ZOOM_IN;
                  }

                  public JSONObject toJson() {
                      JSONObject o = new JSONObject();
                      try {
                          o.put("stepNum", stepNum);
                          o.put("type", type);
                          o.put("name", name == null ? "" : name);
                          o.put("x", primaryParams != null ? primaryParams.x : x);
                          o.put("y", primaryParams != null ? primaryParams.y : y);
                          o.put("x2", secondaryParams != null ? secondaryParams.x : x2);
                          o.put("y2", secondaryParams != null ? secondaryParams.y : y2);
                          o.put("delayMs", delayMs);
                          o.put("durationMs", durationMs);
                          o.put("useRandom", useRandom);
                          o.put("jumpTargetStep", jumpTargetStep);
                          o.put("jumpRepeatCount", jumpRepeatCount);
                      } catch (Exception ignored) {}
                      return o;
                  }

                  public static StepItem fromJson(JSONObject o) {
                      StepItem s = new StepItem();
                      s.stepNum = o.optInt("stepNum", 1);
                      s.type = o.optInt("type", TYPE_TAP);
                      s.name = o.optString("name", "");
                      s.x = o.optInt("x", 400);
                      s.y = o.optInt("y", 400);
                      s.x2 = o.optInt("x2", 600);
                      s.y2 = o.optInt("y2", 600);
                      s.delayMs = o.optInt("delayMs", 300);
                      s.durationMs = o.optInt("durationMs", 60);
                      s.useRandom = o.optBoolean("useRandom", true);
                      s.jumpTargetStep = o.optInt("jumpTargetStep", 1);
                      s.jumpRepeatCount = o.optInt("jumpRepeatCount", 3);
                      return s;
                  }
              }
          """)

          write_file("app/src/main/java/com/smartclicker/app/TargetView.java", r"""
              package com.smartclicker.app;

              import android.content.Context;
              import android.graphics.Canvas;
              import android.graphics.Color;
              import android.graphics.Paint;
              import android.view.View;

              public class TargetView extends View {
                  private final StepItem item;
                  private final boolean isSecondary;
                  private boolean highlighted = false;
                  private final Paint ringPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint fillPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint textPaint = new Paint(Paint.ANTI_ALIAS_FLAG);

                  public TargetView(Context context, StepItem item, boolean isSecondary) {
                      super(context);
                      this.item = item;
                      this.isSecondary = isSecondary;

                      ringPaint.setStyle(Paint.Style.STROKE);
                      ringPaint.setStrokeWidth(3.5f);

                      fillPaint.setStyle(Paint.Style.FILL);

                      textPaint.setColor(Color.WHITE);
                      textPaint.setTextSize(26f);
                      textPaint.setTextAlign(Paint.Align.CENTER);
                      textPaint.setFakeBoldText(true);
                      textPaint.setShadowLayer(4f, 0f, 0f, Color.BLACK);
                  }

                  public void setHighlighted(boolean h) {
                      if (this.highlighted != h) {
                          this.highlighted = h;
                          invalidate();
                      }
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      float w = getWidth();
                      float h = getHeight();
                      float cx = w / 2f;
                      float cy = h / 2f;
                      float r = Math.min(w, h) / 2f - 4f;

                      int baseColor;
                      if (highlighted) {
                          baseColor = Color.parseColor("#FFD700");
                      } else {
                          switch (item.type) {
                              case StepItem.TYPE_SWIPE:
                                  baseColor = Color.parseColor("#10B981");
                                  break;
                              case StepItem.TYPE_ZOOM_OUT:
                                  baseColor = Color.parseColor("#06B6D4");
                                  break;
                              case StepItem.TYPE_ZOOM_IN:
                                  baseColor = Color.parseColor("#8B5CF6");
                                  break;
                              case StepItem.TYPE_JUMP:
                                  baseColor = Color.parseColor("#F59E0B");
                                  break;
                              default:
                                  baseColor = Color.parseColor("#EF4444");
                                  break;
                          }
                      }

                      fillPaint.setColor(highlighted ? Color.argb(130, 255, 215, 0) : Color.argb(45, Color.red(baseColor), Color.green(baseColor), Color.blue(baseColor)));
                      canvas.drawCircle(cx, cy, r, fillPaint);

                      ringPaint.setColor(baseColor);
                      ringPaint.setStrokeWidth(highlighted ? 6f : 3.2f);
                      canvas.drawCircle(cx, cy, r, ringPaint);

                      float tickLen = r * 0.35f;
                      canvas.drawLine(cx - r, cy, cx - r + tickLen, cy, ringPaint);
                      canvas.drawLine(cx + r - tickLen, cy, cx + r, cy, ringPaint);
                      canvas.drawLine(cx, cy - r, cx, cy - r + tickLen, ringPaint);
                      canvas.drawLine(cx, cy + r - tickLen, cx, cy + r, ringPaint);

                      fillPaint.setColor(highlighted ? Color.YELLOW : Color.WHITE);
                      canvas.drawCircle(cx, cy, 3f, fillPaint);

                      String label = String.valueOf(item.stepNum);
                      if (item.type == StepItem.TYPE_SWIPE) {
                          label += isSecondary ? "E" : "S";
                      } else if (item.type == StepItem.TYPE_ZOOM_OUT) {
                          label += isSecondary ? "B-" : "A-";
                      } else if (item.type == StepItem.TYPE_ZOOM_IN) {
                          label += isSecondary ? "B+" : "A+";
                      } else if (item.type == StepItem.TYPE_JUMP) {
                          label += "↺";
                      }

                      textPaint.setColor(highlighted ? Color.BLACK : Color.WHITE);
                      Paint.FontMetrics fm = textPaint.getFontMetrics();
                      float textY = cy - (fm.ascent + fm.descent) / 2f;
                      canvas.drawText(label, cx, textY, textPaint);
                  }
              }
          """)

          write_file("app/src/main/java/com/smartclicker/app/StorageManager.java", r"""
              package com.smartclicker.app;

              import android.content.Context;
              import android.content.SharedPreferences;
              import org.json.JSONArray;
              import org.json.JSONObject;
              import java.util.ArrayList;
              import java.util.List;

              public class StorageManager {
                  private static final String PREF_NAME = "RedClickerStorage";
                  private static final String KEY_DATA = "folders_json";

                  public static JSONObject getRoot(Context ctx) {
                      SharedPreferences sp = ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE);
                      String raw = sp.getString(KEY_DATA, null);
                      if (raw != null) {
                          try { return new JSONObject(raw); } catch (Exception ignored) {}
                      }
                      JSONObject root = new JSONObject();
                      try {
                          JSONObject folders = new JSONObject();
                          folders.put("الهجوم الرئيسي", new JSONObject());
                          folders.put("القرية الصباحية", new JSONObject());
                          folders.put("القرية الليلية", new JSONObject());
                          root.put("folders", folders);
                      } catch (Exception ignored) {}
                      saveRoot(ctx, root);
                      return root;
                  }

                  public static void saveRoot(Context ctx, JSONObject root) {
                      ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                          .edit().putString(KEY_DATA, root.toString()).apply();
                  }

                  public static List<String> getFolderNames(Context ctx) {
                      List<String> list = new ArrayList<>();
                      JSONObject folders = getRoot(ctx).optJSONObject("folders");
                      if (folders != null) {
                          JSONArray names = folders.names();
                          if (names != null) {
                              for (int i = 0; i < names.length(); i++) {
                                  list.add(names.optString(i));
                              }
                          }
                      }
                      if (list.isEmpty()) {
                          addFolder(ctx, "الهجوم الرئيسي");
                          list.add("الهجوم الرئيسي");
                      }
                      return list;
                  }

                  public static void addFolder(Context ctx, String folderName) {
                      try {
                          JSONObject root = getRoot(ctx);
                          JSONObject folders = root.optJSONObject("folders");
                          if (folders == null) { folders = new JSONObject(); root.put("folders", folders); }
                          if (!folders.has(folderName)) {
                              folders.put(folderName, new JSONObject());
                              saveRoot(ctx, root);
                          }
                      } catch (Exception ignored) {}
                  }

                  public static void deleteFolder(Context ctx, String folderName) {
                      try {
                          JSONObject root = getRoot(ctx);
                          JSONObject folders = root.optJSONObject("folders");
                          if (folders != null) {
                              folders.remove(folderName);
                              saveRoot(ctx, root);
                          }
                      } catch (Exception ignored) {}
                  }

                  public static List<String> getProfileNames(Context ctx, String folderName) {
                      List<String> list = new ArrayList<>();
                      JSONObject folders = getRoot(ctx).optJSONObject("folders");
                      if (folders != null) {
                          JSONObject folder = folders.optJSONObject(folderName);
                          if (folder != null) {
                              JSONArray names = folder.names();
                              if (names != null) {
                                  for (int i = 0; i < names.length(); i++) {
                                      list.add(names.optString(i));
                                  }
                              }
                          }
                      }
                      return list;
                  }

                  public static void saveProfile(Context ctx, String folderName, String profileName, List<StepItem> steps) {
                      try {
                          JSONObject root = getRoot(ctx);
                          JSONObject folders = root.optJSONObject("folders");
                          if (folders == null) { folders = new JSONObject(); root.put("folders", folders); }
                          JSONObject folder = folders.optJSONObject(folderName);
                          if (folder == null) { folder = new JSONObject(); folders.put(folderName, folder); }
                          JSONArray arr = new JSONArray();
                          for (StepItem s : steps) arr.put(s.toJson());
                          folder.put(profileName, arr);
                          saveRoot(ctx, root);
                      } catch (Exception ignored) {}
                  }

                  public static List<StepItem> loadProfile(Context ctx, String folderName, String profileName) {
                      List<StepItem> list = new ArrayList<>();
                      JSONObject folders = getRoot(ctx).optJSONObject("folders");
                      if (folders != null) {
                          JSONObject folder = folders.optJSONObject(folderName);
                          if (folder != null) {
                              JSONArray arr = folder.optJSONArray(profileName);
                              if (arr != null) {
                                  for (int i = 0; i < arr.length(); i++) {
                                      JSONObject o = arr.optJSONObject(i);
                                      if (o != null) list.add(StepItem.fromJson(o));
                                  }
                              }
                          }
                      }
                      return list;
                  }

                  public static void deleteProfile(Context ctx, String folderName, String profileName) {
                      try {
                          JSONObject root = getRoot(ctx);
                          JSONObject folders = root.optJSONObject("folders");
                          if (folders != null) {
                              JSONObject folder = folders.optJSONObject(folderName);
                              if (folder != null) {
                                  folder.remove(profileName);
                                  saveRoot(ctx, root);
                              }
                          }
                      } catch (Exception ignored) {}
                  }
              }
          """)

          write_file("app/src/main/java/com/smartclicker/app/MainActivity.java", r"""
              package com.smartclicker.app;

              import android.app.Activity;
              import android.app.AlertDialog;
              import android.content.ClipData;
              import android.content.ClipboardManager;
              import android.content.Intent;
              import android.content.SharedPreferences;
              import android.graphics.Color;
              import android.graphics.drawable.GradientDrawable;
              import android.os.Bundle;
              import android.provider.Settings;
              import android.text.InputType;
              import android.view.Gravity;
              import android.widget.Button;
              import android.widget.CheckBox;
              import android.widget.EditText;
              import android.widget.LinearLayout;
              import android.widget.ScrollView;
              import android.widget.TextView;
              import android.widget.Toast;
              import org.json.JSONObject;

              public class MainActivity extends Activity {
                  private EditText etDelay, etDuration, etSwipeDur, etRandomPx, etRandomMs, etRandomDurMs, etSize, etAlpha, etShrinkSec;
                  private CheckBox cbHorizontal, cbShowHud;
                  private SharedPreferences prefs;

                  @Override
                  protected void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);
                      prefs = getSharedPreferences("ClickerPrefs", MODE_PRIVATE);

                      ScrollView scroll = new ScrollView(this);
                      scroll.setBackgroundColor(Color.parseColor("#121214"));

                      LinearLayout layout = new LinearLayout(this);
                      layout.setOrientation(LinearLayout.VERTICAL);
                      layout.setPadding(36, 36, 36, 50);

                      LinearLayout header = new LinearLayout(this);
                      header.setOrientation(LinearLayout.VERTICAL);
                      header.setPadding(30, 35, 30, 35);
                      GradientDrawable hBg = new GradientDrawable(
                          GradientDrawable.Orientation.LEFT_RIGHT,
                          new int[]{Color.parseColor("#991B1B"), Color.parseColor("#DC2626")});
                      hBg.setCornerRadius(24f);
                      header.setBackground(hBg);

                      TextView title = new TextView(this);
                      title.setText("RED AUTO CLICKER v2.0");
                      title.setTextSize(22);
                      title.setTextColor(Color.WHITE);
                      title.setGravity(Gravity.CENTER);
                      title.getPaint().setFakeBoldText(true);
                      header.addView(title);

                      TextView sub = new TextView(this);
                      sub.setText("نظام التحكم المتقدم متعدد الطبقات للألعاب");
                      sub.setTextSize(13);
                      sub.setTextColor(Color.parseColor("#FEE2E2"));
                      sub.setGravity(Gravity.CENTER);
                      header.addView(sub);
                      layout.addView(header);

                      Button btnAcc = createButton("1. تفعيل خدمة إمكانية الوصول (إلزامي)", "#2563EB");
                      btnAcc.setOnClickListener(v -> {
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                          Toast.makeText(this, "اختر (Red Auto Clicker) وقم بتفعيله", Toast.LENGTH_LONG).show();
                      });
                      layout.addView(btnAcc);

                      Button btnStart = createButton("2. تشغيل وإظهار شريط Red العائم", "#DC2626");
                      btnStart.setOnClickListener(v -> {
                          savePreferences();
                          if (ClickerService.instance != null) {
                              ClickerService.instance.showControlBar();
                              Toast.makeText(this, "تم إظهار الشريط العائم بنجاح", Toast.LENGTH_SHORT).show();
                          } else {
                              Toast.makeText(this, "فعّل خدمة إمكانية الوصول أولاً من الزر رقم 1", Toast.LENGTH_LONG).show();
                          }
                      });
                      layout.addView(btnStart);

                      LinearLayout rowBtns = new LinearLayout(this);
                      rowBtns.setOrientation(LinearLayout.HORIZONTAL);
                      Button btnGuide = createButton("📖 دليل الأوامر والشرح", "#374151");
                      LinearLayout.LayoutParams gp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                      gp.setMargins(0, 20, 8, 10);
                      btnGuide.setLayoutParams(gp);
                      btnGuide.setOnClickListener(v -> showGuideDialog());

                      Button btnBackup = createButton("📦 تصدير / استيراد السجلات", "#4B5563");
                      LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                      bp.setMargins(8, 20, 0, 10);
                      btnBackup.setLayoutParams(bp);
                      btnBackup.setOnClickListener(v -> showBackupDialog());

                      rowBtns.addView(btnGuide);
                      rowBtns.addView(btnBackup);
                      layout.addView(rowBtns);

                      addSectionHeader(layout, "⚙️ التوقيت الافتراضي للخطوات الجديدة");
                      etDelay = addInputField(layout, "وقت الانتظار قبل العملية (مللي ثانية - 1000 = ثانية):", String.valueOf(prefs.getInt("def_delay", 300)));
                      etDuration = addInputField(layout, "مدة اللمسة العادية (مللي ثانية - ينصح بـ 50 إلى 80):", String.valueOf(prefs.getInt("def_duration", 60)));
                      etSwipeDur = addInputField(layout, "مدة السحب أو التصغير/التكبير (مللي ثانية - ينصح بـ 350):", String.valueOf(prefs.getInt("def_swipe_dur", 350)));

                      addSectionHeader(layout, "🛡️ مكافحة الكشف والحظر (العشوائية الذكية)");
                      etRandomPx = addInputField(layout, "نطاق انتشار اللمسة بالبكسل (الدقيق والآمن: من 8 إلى 15 بكسل):", String.valueOf(prefs.getInt("def_rand_px", 11)));
                      etRandomMs = addInputField(layout, "عشوائية وقت الانتظار (مللي ثانية - ينصح بـ 25 إلى 50):", String.valueOf(prefs.getInt("def_rand_ms", 35)));
                      etRandomDurMs = addInputField(layout, "عشوائية مدة اللمس (مللي ثانية - ينصح بـ 15):", String.valueOf(prefs.getInt("def_rand_dur", 15)));

                      addSectionHeader(layout, "🎨 المظهر والشريط العائم الذكي");
                      etSize = addInputField(layout, "حجم دائرة التصويب البصري فقط (من 65 إلى 180 - لا يؤثر على البكسل):", String.valueOf(prefs.getInt("def_size", 95)));
                      etAlpha = addInputField(layout, "شفافية الشريط والدوائر (من 25 إلى 100%):", String.valueOf(prefs.getInt("def_alpha", 85)));
                      etShrinkSec = addInputField(layout, "تحويل الشريط لفقاعة (R) تلقائياً بعد عدم اللمس بـ (ثوانٍ - 0 لإلغائه):", String.valueOf(prefs.getInt("def_shrink_sec", 4)));

                      cbHorizontal = new CheckBox(this);
                      cbHorizontal.setText("عرض الشريط العائم بشكل أفقي (عرضي)");
                      cbHorizontal.setTextColor(Color.WHITE);
                      cbHorizontal.setChecked(prefs.getBoolean("bar_horizontal", true));
                      layout.addView(cbHorizontal);

                      cbShowHud = new CheckBox(this);
                      cbShowHud.setText("إظهار نافذة العداد العائمة المصغرة (شفافة للمس ولا تحجب اللعبة)");
                      cbShowHud.setTextColor(Color.WHITE);
                      cbShowHud.setChecked(prefs.getBoolean("show_hud", true));
                      layout.addView(cbShowHud);

                      Button btnSave = createButton("💾 حفظ جميع الإعدادات وتحديث الشريط", "#16A34A");
                      btnSave.setOnClickListener(v -> {
                          savePreferences();
                          if (ClickerService.instance != null) {
                              ClickerService.instance.refreshBarStyle();
                          }
                      });
                      layout.addView(btnSave);

                      scroll.addView(layout);
                      setContentView(scroll);
                  }

                  private void addSectionHeader(LinearLayout parent, String text) {
                      TextView tv = new TextView(this);
                      tv.setText(text);
                      tv.setTextSize(16);
                      tv.setTextColor(Color.parseColor("#F87171"));
                      tv.getPaint().setFakeBoldText(true);
                      tv.setPadding(0, 35, 0, 10);
                      parent.addView(tv);
                  }

                  private void savePreferences() {
                      try {
                          prefs.edit()
                              .putInt("def_delay", Math.max(10, Integer.parseInt(etDelay.getText().toString())))
                              .putInt("def_duration", Math.max(15, Integer.parseInt(etDuration.getText().toString())))
                              .putInt("def_swipe_dur", Math.max(50, Integer.parseInt(etSwipeDur.getText().toString())))
                              .putInt("def_rand_px", Math.max(0, Integer.parseInt(etRandomPx.getText().toString())))
                              .putInt("def_rand_ms", Math.max(0, Integer.parseInt(etRandomMs.getText().toString())))
                              .putInt("def_rand_dur", Math.max(0, Integer.parseInt(etRandomDurMs.getText().toString())))
                              .putInt("def_size", Math.max(60, Math.min(220, Integer.parseInt(etSize.getText().toString()))))
                              .putInt("def_alpha", Math.max(20, Math.min(100, Integer.parseInt(etAlpha.getText().toString()))))
