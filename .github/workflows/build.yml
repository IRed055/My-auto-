                 public static View showBarRulerPicker(final Context ctx, final WindowManager wm, final Bitmap screenBmp,
                                                       int initAX, int initAY, int initBX, int initBY, final RulerPickCallback cb) {
                     final DisplayMetrics dm = getRealScreenMetrics(ctx, wm, screenBmp);
                     final int sw = dm.widthPixels, sh = dm.heightPixels;
                     final int[] ptA = new int[]{Math.max(15, Math.min(sw - 15, initAX)), Math.max(15, Math.min(sh - 15, initAY))};
                     final int[] ptB = new int[]{Math.max(15, Math.min(sw - 15, initBX)), Math.max(15, Math.min(sh - 15, initBY))};
                     if (Math.abs(ptA[0] - ptB[0]) < 20 && Math.abs(ptA[1] - ptB[1]) < 20) {
                         ptB[0] = Math.min(sw - 30, ptA[0] + 220);
                     }
                     final int[] draggingWhich = new int[]{0};
                     final LinearLayout capsule = createFloatingCapsule(ctx);
                     final boolean[] isAtTop = new boolean[]{false};
                     final FrameLayout root = new FrameLayout(ctx);
                     final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                     final View canvasView = new View(ctx) {
                         @Override
                         protected void onDraw(Canvas canvas) {
                             super.onDraw(canvas);
                             if (screenBmp != null && !screenBmp.isRecycled()) {
                                 canvas.drawBitmap(screenBmp, 0, 0, null);
                             }
                             float ax = ptA[0], ay = ptA[1], bx = ptB[0], by = ptB[1];
                             p.setStyle(Paint.Style.STROKE);
                             p.setStrokeWidth(4.5f);
                             p.setColor(Color.argb(200, 0, 0, 0));
                             canvas.drawLine(ax, ay, bx, by, p);
                             p.setStrokeWidth(2.8f);
                             p.setColor(Color.parseColor("#38BDF8"));
                             canvas.drawLine(ax, ay, bx, by, p);
                             for (int i = 1; i <= 9; i++) {
                                 float r = i / 10f;
                                 float tx = ax + (bx - ax) * r;
                                 float ty = ay + (by - ay) * r;
                                 p.setStyle(Paint.Style.FILL);
                                 p.setColor(i == 5 ? Color.YELLOW : Color.WHITE);
                                 canvas.drawCircle(tx, ty, i == 5 ? 5.5f : 3.5f, p);
                             }
                             drawDirectionArrow(canvas, ax, ay, ax + (bx - ax) * 0.35f, ay + (by - ay) * 0.35f, 18f, p);
                             drawDirectionArrow(canvas, ax, ay, ax + (bx - ax) * 0.70f, ay + (by - ay) * 0.70f, 18f, p);
                             drawRulerKnob(canvas, ax, ay, "A (0%)", Color.parseColor("#10B981"), p);
                             drawRulerKnob(canvas, bx, by, "B (100%)", Color.parseColor("#F59E0B"), p);
                             if (draggingWhich[0] == 1) {
                                 drawFloatingLoupe(canvas, screenBmp, ptA[0], ptA[1], sw, sh, true, p);
                             } else if (draggingWhich[0] == 2) {
                                 drawFloatingLoupe(canvas, screenBmp, ptB[0], ptB[1], sw, sh, true, p);
                             }
                         }
                     };
                     canvasView.setOnTouchListener((v, e) -> {
                         float x = e.getRawX(), y = e.getRawY();
                         if (e.getAction() == MotionEvent.ACTION_DOWN) {
                             float dA = dist(x, y, ptA[0], ptA[1]);
                             float dB = dist(x, y, ptB[0], ptB[1]);
                             draggingWhich[0] = (dA <= dB) ? 1 : 2;
                             int cx = Math.max(2, Math.min(sw - 2, (int) x));
                             int cy = Math.max(2, Math.min(sh - 2, (int) y));
                             if (draggingWhich[0] == 1) { ptA[0] = cx; ptA[1] = cy; }
                             else { ptB[0] = cx; ptB[1] = cy; }
                             autoDodgeCapsule(capsule, isAtTop, cy, sh);
                             canvasView.invalidate();
                             return true;
                         } else if (e.getAction() == MotionEvent.ACTION_MOVE) {
                             int cx = Math.max(2, Math.min(sw - 2, (int) x));
                             int cy = Math.max(2, Math.min(sh - 2, (int) y));
                             if (draggingWhich[0] == 1) { ptA[0] = cx; ptA[1] = cy; }
                             else if (draggingWhich[0] == 2) { ptB[0] = cx; ptB[1] = cy; }
                             autoDodgeCapsule(capsule, isAtTop, cy, sh);
                             canvasView.invalidate();
                             return true;
                         } else if (e.getAction() == MotionEvent.ACTION_UP) {
                             draggingWhich[0] = 0;
                             canvasView.invalidate();
                             return true;
                         }
                         return false;
                     });
                     root.addView(canvasView, new FrameLayout.LayoutParams(
                         FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                     TextView tvHint = new TextView(ctx);
                     tvHint.setText("اسحب A(0%) و B(100%) ");
                     tvHint.setTextColor(Color.WHITE);
                     tvHint.setTextSize(12);
                     capsule.addView(tvHint);
                     addCapsuleTransparencyToggle(ctx, capsule, isAtTop);
                     Button bOk = createActionBtn(ctx, "✅ اعتماد المسطرة", "#16A34A");
                     bOk.setOnClickListener(v -> {
                         try { wm.removeView(root); } catch (Exception ignored) {}
                         cb.onPicked(ptA[0], ptA[1], ptB[0], ptB[1]);
                     });
                     capsule.addView(bOk);
                     Button bCancel = createActionBtn(ctx, "❌ إلغاء", "#991B1B");
                     bCancel.setOnClickListener(v -> {
                         try { wm.removeView(root); } catch (Exception ignored) {}
                         cb.onCancel();
                     });
                     capsule.addView(bCancel);
                     FrameLayout.LayoutParams capLp = new FrameLayout.LayoutParams(
                         FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT,
                         Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL);
                     capLp.bottomMargin = 18;
                     root.addView(capsule, capLp);
                     autoDodgeCapsule(capsule, isAtTop, Math.max(ptA[1], ptB[1]), sh);
                     wm.addView(root, createOverlayParams());
                     return root;
                 }
                 private static void drawRulerKnob(Canvas canvas, float x, float y, String label, int color, Paint p) {
                     p.setStyle(Paint.Style.FILL);
                     p.setColor(Color.argb(65, Color.red(color), Color.green(color), Color.blue(color)));
                     canvas.drawCircle(x, y, 34f, p);
                     p.setStyle(Paint.Style.STROKE);
                     p.setStrokeWidth(4f);
                     p.setColor(color);
                     canvas.drawCircle(x, y, 34f, p);
                     p.setStrokeWidth(2.5f);
                     p.setColor(Color.WHITE);
                     canvas.drawLine(x - 14, y, x + 14, y, p);
                     canvas.drawLine(x, y - 14, x, y + 14, p);
                     RectF tag = new RectF(x - 42, y - 64, x + 42, y - 38);
                     p.setStyle(Paint.Style.FILL);
                     p.setColor(Color.parseColor("#DD18181B"));
                     canvas.drawRoundRect(tag, 8f, 8f, p);
                     p.setColor(Color.WHITE);
                     p.setTextSize(15f);
                     p.setTextAlign(Paint.Align.CENTER);
                     canvas.drawText(label, x, y - 46, p);
                     p.setTextAlign(Paint.Align.LEFT);
                 }
                 private static void drawDirectionArrow(Canvas canvas, float fx, float fy, float tx, float ty, float sz, Paint p) {
                     double ang = Math.atan2(ty - fy, tx - fx);
                     Path path = new Path();
                     path.moveTo(tx, ty);
                     path.lineTo((float) (tx - sz * Math.cos(ang - Math.PI / 6)), (float) (ty - sz * Math.sin(ang - Math.PI / 6)));
                     path.lineTo((float) (tx - sz * Math.cos(ang + Math.PI / 6)), (float) (ty - sz * Math.sin(ang + Math.PI / 6)));
                     path.close();
                     p.setStyle(Paint.Style.FILL);
                     p.setColor(Color.parseColor("#38BDF8"));
                     canvas.drawPath(path, p);
                 }
                 private static float dist(float x1, float y1, float x2, float y2) {
                     return (float) Math.hypot(x1 - x2, y1 - y2);
                 }
                 private static Button createActionBtn(Context ctx, String text, String hex) {
                     Button b = new Button(ctx);
                     b.setText(text);
                     b.setTextColor(Color.WHITE);
                     b.setTextSize(11);
                     b.setPadding(18, 8, 18, 8);
                     GradientDrawable bg = new GradientDrawable();
                     bg.setColor(Color.parseColor(hex));
                     bg.setCornerRadius(16f);
                     b.setBackgroundDrawable(bg);
                     LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                         LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                     lp.setMargins(6, 0, 0, 0);
                     b.setLayoutParams(lp);
                     return b;
                 }
                 private static WindowManager.LayoutParams createOverlayParams() {
                     return new WindowManager.LayoutParams(
                         WindowManager.LayoutParams.MATCH_PARENT,
                         WindowManager.LayoutParams.MATCH_PARENT,
                         WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                         WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                         PixelFormat.TRANSLUCENT);
                 }
             }
