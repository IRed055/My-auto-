                  private void normalizeStepNumbers() {
                      List<Integer> unique = getSortedUniqueSteps();
                      Map<Integer, Integer> map = new HashMap<>();
                      for (int i = 0; i < unique.size(); i++) {
                          map.put(unique.get(i), i + 1);
                      }
                      for (StepItem s : steps) {
                          Integer newNum = map.get(s.stepNum);
                          if (newNum != null) s.stepNum = newNum;
                          if (map.containsKey(s.jumpTargetStep)) s.jumpTargetStep = map.get(s.jumpTargetStep);
                          else s.jumpTargetStep = Math.max(1, Math.min(unique.size(), s.jumpTargetStep));
                          if (s.primaryView != null) s.primaryView.invalidate();
                          if (s.secondaryView != null) s.secondaryView.invalidate();
                      }
                      refreshVectorOverlay();
                  }
                  private int getNextSequentialStepNum() {
                      List<Integer> unique = getSortedUniqueSteps();
                      return unique.isEmpty() ? 1 : (unique.get(unique.size() - 1) + 1);
                  }
                  private void addStep(int type) {
                      insertStepAt(getNextSequentialStepNum(), type);
                  }
                  private void insertStepAt(int targetStepNum, int type) {
                      SharedPreferences prefs = getSharedPreferences("ClickerPrefs", MODE_PRIVATE);
                      DisplayMetrics dm = getRealDisplayMetrics();
                      int size = prefs.getInt("def_size", 95);
                      StepItem item = new StepItem();
                      item.stepNum = targetStepNum;
                      item.type = type;
                      item.delayMs = prefs.getInt("def_delay", 300);
                      item.durationMs = (type == StepItem.TYPE_TAP) ? prefs.getInt("def_duration", 60) : prefs.getInt("def_swipe_dur", 350);
                      item.repeatCount = Math.max(1, prefs.getInt("def_repeat", 1));
                      item.useRandom = prefs.getBoolean("def_use_rand", true);
                      item.customRandPx = prefs.getInt("def_rand_px", 11);
                      item.customRandMs = prefs.getInt("def_rand_ms", 35);
                      item.customRandDur = prefs.getInt("def_rand_dur", 15);
                      item.jumpTargetStep = 1;
                      item.jumpRepeatCount = 3;
                      if (type == StepItem.TYPE_VISION_CHECK) {
                          item.useCondition = true;
                      }
                      int centerX = (dm.widthPixels - size) / 2;
                      int centerY = (dm.heightPixels - size) / 2;
                      int offset = ((steps.size() % 5) - 2) * 24;
                      item.x = Math.max(20, centerX + offset);
                      item.y = Math.max(20, centerY + offset);
                      item.x2 = Math.min(dm.widthPixels - size - 20, item.x + 220);
                      item.y2 = Math.min(dm.heightPixels - size - 20, item.y + (type == StepItem.TYPE_SWIPE ? 140 : 0));
                      item.condAX1 = dm.widthPixels / 2;
                      item.condAY1 = dm.heightPixels / 2;
                      item.condAX2 = Math.min(dm.widthPixels - 40, item.condAX1 + 220);
                      item.condAY2 = item.condAY1;
                      item.condBX1 = dm.widthPixels / 2;
                      item.condBY1 = Math.min(dm.heightPixels - 60, (dm.heightPixels / 2) + 80);
                      item.condBX2 = Math.min(dm.widthPixels - 40, item.condBX1 + 220);
                      item.condBY2 = item.condBY1;
                      createStepViews(item);
                      steps.add(item);
                      normalizeStepNumbers();
                      applyVisibilityRules();
                      triggerEmergencyAutoSave();
                      updateHudText("Red Clicker | الخطوات: " + steps.size());
                  }
                  private void createStepViews(final StepItem item) {
                      SharedPreferences prefs = getSharedPreferences("ClickerPrefs", MODE_PRIVATE);
                      int size = prefs.getInt("def_size", 95);
                      float alpha = prefs.getInt("def_alpha", 88) / 100f;
                      TargetView pv = new TargetView(this, item, false);
                      pv.setAlpha(alpha);
                      WindowManager.LayoutParams pp = new WindowManager.LayoutParams(
                          size, size,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT);
                      pp.gravity = Gravity.TOP | Gravity.START;
                      pp.x = item.x;
                      pp.y = item.y;
                      item.primaryView = pv;
                      item.primaryParams = pp;
                      attachMarkerTouchListener(pv, pp, item, false);
                      wm.addView(pv, pp);
                      if (item.hasSecondaryPoint()) {
                          TargetView sv = new TargetView(this, item, true);
                          sv.setAlpha(alpha);
                          WindowManager.LayoutParams sp = new WindowManager.LayoutParams(
                              size, size,
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                              PixelFormat.TRANSLUCENT);
                          sp.gravity = Gravity.TOP | Gravity.START;
                          sp.x = item.x2;
                          sp.y = item.y2;
                          item.secondaryView = sv;
                          item.secondaryParams = sp;
                          attachMarkerTouchListener(sv, sp, item, true);
                          wm.addView(sv, sp);
                      }
                      refreshVectorOverlay();
                  }
                  private void attachMarkerTouchListener(final TargetView tv, final WindowManager.LayoutParams lp, final StepItem item, final boolean isSec) {
                      tv.setOnTouchListener(new View.OnTouchListener() {
                          int initX, initY;
                          float touchX, touchY;
                          @Override
                          public boolean onTouch(View v, MotionEvent e) {
                              if (isRunning) return false;
                              if (lockPreviousSteps && steps.indexOf(item) < steps.size() - 1) {
                                  if (e.getAction() == MotionEvent.ACTION_DOWN) {
                                      long now = System.currentTimeMillis();
                                      if (now - lastLockToastTime > 3500) {
                                          lastLockToastTime = now;
                                          showSingleToast("الخطوات السابقة مقفلة لحمايتها");
                                      }
                                  }
                                  return true;
                              }
                              if (e.getAction() == MotionEvent.ACTION_DOWN) {
                                  initX = lp.x; initY = lp.y;
                                  touchX = e.getRawX(); touchY = e.getRawY();
                                  return true;
                              } else if (e.getAction() == MotionEvent.ACTION_MOVE) {
                                  lp.x = initX + (int) (e.getRawX() - touchX);
                                  lp.y = initY + (int) (e.getRawY() - touchY);
                                  if (isSec) { item.x2 = lp.x; item.y2 = lp.y; }
                                  else { item.x = lp.x; item.y = lp.y; }
                                  wm.updateViewLayout(tv, lp);
                                  refreshVectorOverlay();
                                  return true;
                              } else if (e.getAction() == MotionEvent.ACTION_UP) {
                                  triggerEmergencyAutoSave();
                                  if (Math.abs(e.getRawX() - touchX) < 15 && Math.abs(e.getRawY() - touchY) < 15) {
                                      showEditStepDialog(item);
                                  }
                                  return true;
                              }
                              return false;
                          }
                      });
                  }
                  private void removeStepViews(StepItem item) {
                      try {
                          if (item.primaryView != null) wm.removeView(item.primaryView);
                          if (item.secondaryView != null) wm.removeView(item.secondaryView);
                      } catch (Exception ignored) {}
                      refreshVectorOverlay();
                  }
                  private void applyVisibilityRules() {
                      int total = steps.size();
                      for (int i = 0; i < total; i++) {
                          StepItem s = steps.get(i);
                          boolean visible = !isAllHidden;
                          if (visible && showLast5Only && i < total - 5) {
                              visible = false;
                          }
                          int vis = visible ? View.VISIBLE : View.INVISIBLE;
                          if (s.primaryView != null) {
                              s.primaryView.setVisibility(vis);
                              s.primaryView.invalidate();
                          }
                          if (s.secondaryView != null) {
                              s.secondaryView.setVisibility(vis);
                              s.secondaryView.invalidate();
                          }
                      }
                      refreshVectorOverlay();
                  }
                  private void showEditStepDialog(final StepItem item) {
                      LinearLayout box = createPopupContainer("تعديل " + item.getTypeLabel() + " (خطوة " + item.stepNum + ")");
                      final EditText etName = createPopupInput(box, "اسم توضيحي للخطوة (اختياري):", item.name, false, false);
                      final EditText etStep = createPopupInput(box, "رقم الخطوة (نفس الرقم = تنفيذ متزامن):", String.valueOf(item.stepNum), true, false);
                      final EditText etDelay = createPopupInput(box, "وقت الانتظار قبل البدء (مللي ثانية):", String.valueOf(item.delayMs), true, true);
                      final EditText etDur;
                      final EditText etJumpTarget;
                      final EditText etJumpRep;
                      if (item.type == StepItem.TYPE_JUMP) {
                          etDur = null;
                          etJumpTarget = createPopupInput(box, "انتقل / ارجع إلى الخطوة رقم:", String.valueOf(item.jumpTargetStep), true, false);
                          etJumpRep = createPopupInput(box, "عدد مرات تكرار القفزة ثم إكمال المسار:", String.valueOf(item.jumpRepeatCount), true, false);
                      } else if (item.type == StepItem.TYPE_VISION_CHECK) {
                          etDur = null;
                          etJumpTarget = null;
                          etJumpRep = null;
                      } else {
                          etDur = createPopupInput(box, "مدة اللمس أو السحب (مللي ثانية):", String.valueOf(item.durationMs), true, true);
                          etJumpTarget = null;
                          etJumpRep = null;
                      }
                      final EditText etRepeat = createPopupInput(box, "عدد تكرارات هذه العملية قبل الانتقال للتالية (الافتراضي 1):", String.valueOf(Math.max(1, item.repeatCount)), true, false);
                      LinearLayout randRow = new LinearLayout(this);
                      randRow.setOrientation(LinearLayout.HORIZONTAL);
                      randRow.setGravity(Gravity.CENTER_VERTICAL);
                      final CheckBox cbRand = new CheckBox(this);
                      cbRand.setText("تفعيل مكافحة الحظر" + (item.useCustomRandom ? " (مخصص)" : ""));
                      cbRand.setTextColor(Color.WHITE);
                      cbRand.setChecked(item.useRandom);
                      cbRand.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                      Button btnCustomRand = createPopupButton("⋮ تخصيص", "#374151");
                      LinearLayout.LayoutParams crp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                      crp.setMargins(8, 4, 0, 4);
                      btnCustomRand.setLayoutParams(crp);
                      final Runnable saveLogic = () -> {
                          try {
                              item.name = etName.getText().toString().trim();
                              item.stepNum = Math.max(1, Integer.parseInt(etStep.getText().toString()));
                              item.delayMs = Math.max(10, Integer.parseInt(etDelay.getText().toString()));
                              if (etDur != null) item.durationMs = Math.max(15, Integer.parseInt(etDur.getText().toString()));
                              if (etJumpTarget != null) item.jumpTargetStep = Math.max(1, Integer.parseInt(etJumpTarget.getText().toString()));
                              if (etJumpRep != null) item.jumpRepeatCount = Math.max(1, Integer.parseInt(etJumpRep.getText().toString()));
                              int rep = 1;
                              try { rep = Integer.parseInt(etRepeat.getText().toString().trim()); } catch (Exception ignored) {}
                              item.repeatCount = Math.max(1, rep);
                              item.useRandom = cbRand.isChecked();
                              if (item.primaryView != null) item.primaryView.invalidate();
                              if (item.secondaryView != null) item.secondaryView.invalidate();
                              refreshVectorOverlay();
                              triggerEmergencyAutoSave();
                          } catch (Exception ignored) {}
                      };
                      btnCustomRand.setOnClickListener(v -> {
                          saveLogic.run();
                          showCustomRandomDialog(item);
                      });
                      randRow.addView(cbRand);
                      randRow.addView(btnCustomRand);
                      box.addView(randRow);
                      Button bCond = createPopupButton(
                          (item.useCondition || item.type == StepItem.TYPE_VISION_CHECK)
                              ? "👁️ إعدادات الشرط البصري والمنظار والمسطرة (مفعّل)"
                              : "👁️ ربط هذه الخطوة بشرط بصري / شريط (اختياري)",
                          (item.useCondition || item.type == StepItem.TYPE_VISION_CHECK) ? "#0891B2" : "#4B5563");
                      bCond.setOnClickListener(v -> {
                          saveLogic.run();
                          showConditionDialog(item);
                      });
                      box.addView(bCond);
                      Button bSave = createPopupButton("💾 حفظ وإغلاق", "#16A34A");
                      bSave.setOnClickListener(v -> saveAndDismissPopup());
                      box.addView(bSave);
                      Button bTestFromHere = createPopupButton("▶ تجربة التشغيل بدءاً من هذه الخطوة", "#2563EB");
                      bTestFromHere.setOnClickListener(v -> {
                          saveAndDismissPopup();
                          startScenarioFromStepNum(item.stepNum);
                      });
                      box.addView(bTestFromHere);
                      Button bDelete = createPopupButton("🗑️ حذف هذه الخطوة (مع إعادة ترتيب الأرقام)", "#991B1B");
                      bDelete.setOnClickListener(v -> {
                          activePopupAutoSave = null;
                          steps.remove(item);
                          removeStepViews(item);
                          normalizeStepNumbers();
                          triggerEmergencyAutoSave();
                          dismissPopupDirect();
                          updateHudText("Red Clicker | الخطوات: " + steps.size());
                      });
                      box.addView(bDelete);
                      showPopupView(box, saveLogic);
                  }
                  private void showCustomRandomDialog(final StepItem item) {
                      LinearLayout box = createPopupContainer("⋮ تخصيص مكافحة الحظر للخطوة #" + item.stepNum + " فقط");
                      final CheckBox cbUseCustom = new CheckBox(this);
