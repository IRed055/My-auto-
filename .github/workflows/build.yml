                  public void refreshBarStyle() {
                      if (rootBarContainer == null) return;
                      SharedPreferences prefs = getSharedPreferences("ClickerPrefs", MODE_PRIVATE);
                      float alpha = prefs.getInt("def_alpha", 85) / 100f;
                      boolean isHoriz = prefs.getBoolean("bar_horizontal", true);
                      rootBarContainer.setAlpha(alpha);
                      buildBarLayout.setOrientation(isHoriz ? LinearLayout.HORIZONTAL : LinearLayout.VERTICAL);
                      if (hudView != null) {
                          hudView.setVisibility(prefs.getBoolean("show_hud", true) ? View.VISIBLE : View.GONE);
                      }
                      int size = prefs.getInt("def_size", 95);
                      for (StepItem s : steps) {
                          if (s.primaryView != null && s.primaryParams != null) {
                              s.primaryParams.width = size;
                              s.primaryParams.height = size;
                              s.primaryView.setAlpha(alpha);
                              wm.updateViewLayout(s.primaryView, s.primaryParams);
                          }
                          if (s.secondaryView != null && s.secondaryParams != null) {
                              s.secondaryParams.width = size;
                              s.secondaryParams.height = size;
                              s.secondaryView.setAlpha(alpha);
                              wm.updateViewLayout(s.secondaryView, s.secondaryParams);
                          }
                      }
                      scheduleAutoShrink();
                  }

                  private void touchBarActivity() {
                      scheduleAutoShrink();
                  }

                  private void scheduleAutoShrink() {
                      shrinkHandler.removeCallbacksAndMessages(null);
                      if (isRunning || isPaused || rootBarContainer == null) return;
                      SharedPreferences prefs = getSharedPreferences("ClickerPrefs", MODE_PRIVATE);
                      int sec = prefs.getInt("def_shrink_sec", 4);
                      if (sec <= 0) return;
                      shrinkHandler.postDelayed(() -> {
                          if (!isRunning && !isPaused && buildBarLayout != null && bubbleView != null) {
                              buildBarLayout.setVisibility(View.GONE);
                              bubbleView.setVisibility(View.VISIBLE);
                              bubbleView.setAlpha(0.55f);
                          }
                      }, sec * 1000L);
                  }

                  private void expandFromBubble() {
                      if (rootBarContainer == null) return;
                      bubbleView.setVisibility(View.GONE);
                      if (isRunning || isPaused) {
                          playBarLayout.setVisibility(View.VISIBLE);
                      } else {
                          buildBarLayout.setVisibility(View.VISIBLE);
                          scheduleAutoShrink();
                      }
                  }

                  private void setupDragAndLock(View grip) {
                      grip.setOnTouchListener(new View.OnTouchListener() {
                          int initX, initY;
                          float touchX, touchY;
                          long downTime;
                          @Override
                          public boolean onTouch(View v, MotionEvent e) {
                              touchBarActivity();
                              if (e.getAction() == MotionEvent.ACTION_DOWN) {
                                  initX = barParams.x; initY = barParams.y;
                                  touchX = e.getRawX(); touchY = e.getRawY();
                                  downTime = System.currentTimeMillis();
                                  return true;
                              } else if (e.getAction() == MotionEvent.ACTION_MOVE) {
                                  if (isBarPositionLocked) return true;
                                  barParams.x = initX + (int) (e.getRawX() - touchX);
                                  barParams.y = initY + (int) (e.getRawY() - touchY);
                                  wm.updateViewLayout(rootBarContainer, barParams);
                                  return true;
                              } else if (e.getAction() == MotionEvent.ACTION_UP) {
                                  if (Math.abs(e.getRawX() - touchX) < 15 && Math.abs(e.getRawY() - touchY) < 15
                                      && System.currentTimeMillis() - downTime > 500) {
                                      showGripOptionsDialog();
                                  }
                                  return true;
                              }
                              return false;
                          }
                      });
                  }

